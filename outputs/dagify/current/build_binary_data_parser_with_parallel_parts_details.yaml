dag_type: plain_text
description: Generated workflow from UI.
name: build_binary_data_parser_with_parallel_parts
nodes:
  define_supported_codecs_combined:
    agent: false
    description: Creates the authoritative codec registry for the binary parser by
      merging the two pre‑validated partial lists. It removes duplicates (by identical
      `codec`), preserves the first occurrence, sorts alphabetically, validates the
      schema, and emits a canonical JSON array ready for downstream parsing modules.
      Malformed input triggers a clear error.
    name: define_supported_codecs_combined
    nodes_depended_on:
    - define_supported_codecs_part1
    - define_supported_codecs_part2
    nodes_dependent_on: []
    prompt: "### Purpose\nMerge the two JSON arrays emitted by **define_supported_codecs_part1**\
      \ and **define_supported_codecs_part2** into a single, canonical codec registry.\n\
      \n### Input Format\n* Two well‑formed JSON arrays, each containing objects with\
      \ the exact schema:\n  ```json\n  { \"codec\": \"<non‑empty string>\", \"description\"\
      : \"<single‑line text>\" }\n  ```\n* `codec` must be a non‑empty string.\n*\
      \ `description` must be a single line with no line breaks and no more than 30\
      \ words.\n\n### Validation Rules\n1. Every element must contain both `codec`\
      \ and `description`.\n2. `codec` values are case‑insensitive identifiers; duplicates\
      \ are identified by exact string match.\n3. `description` is trimmed of leading/trailing\
      \ whitespace.\n4. Any deviation (malformed JSON, missing fields, empty values,\
      \ multi‑line description, >30 words) causes the node to raise an error with\
      \ a descriptive message.\n\n### Transformation Steps\n1. Concatenate the two\
      \ arrays in the order received.\n2. Iterate through the concatenated list, adding\
      \ each entry to a result array only if its `codec` has not been seen before.\
      \ Preserve the first occurrence.\n3. Sort the result array alphabetically by\
      \ the `codec` field (Unicode code‑point order).\n\n### Output\n* A single, well‑formed\
      \ JSON array of the deduplicated, sorted codec objects.\n* No additional text,\
      \ comments, or formatting.\n\n### Error Handling\nIf validation fails, raise\
      \ an exception containing a clear error message. The downstream system will\
      \ treat any non‑JSON output as a failure.\n\n*Example of a successful output*:\n\
      ```json\n[{\n  \"codec\": \"ascii\",\n  \"description\": \"7‑bit ASCII, no BOM,\
      \ .txt\"\n},{\n  \"codec\": \"utf-8\",\n  \"description\": \"Unicode UTF‑8,\
      \ variable length, optional BOM, .txt, .json, RFC 3629\"\n}]\n```\n\nThis registry\
      \ is the authoritative source for all downstream parsing modules."
  define_supported_codecs_part1:
    agent: false
    description: Generates a technically detailed enumeration of the binary parser’s
      supported codec identifiers for the first half of the catalogue. The list includes
      common text encodings (ASCII, ISO‑8859‑1, Windows‑1252, UTF‑8, UTF‑16 variants,
      UTF‑32 variants, UTF‑7) and a binary representation (Base64). Each entry contains
      the codec’s canonical name and a concise, specification‑driven description that
      covers reference standard, BOM or byte patterns, typical file extensions or
      MIME types, and any special parsing nuances. The output is a JSON array of objects
      with `codec` and `description` fields, ready for downstream consumption.
    name: define_supported_codecs_part1
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: "Generate the first segment of the binary parser’s supported codec catalogue.\
      \ Include these encodings:\n\n- **ASCII** – 7‑bit, no BOM, typical extensions:\
      \ `.txt`, MIME `text/plain`.\n- **ISO‑8859‑1** – 8‑bit, no BOM, extensions:\
      \ `.txt`, `.html`, MIME `text/html`.\n- **Windows‑1252** – 8‑bit, no BOM, extensions:\
      \ `.txt`, `.html`, MIME `text/html`.\n- **UTF‑8** – variable‑length, optional\
      \ BOM `EF BB BF`, extensions: `.txt`, `.json`, MIME `application/json`, RFC 3629.\n\
      - **UTF‑16LE** – 16‑bit, mandatory BOM `FF FE`, extensions: `.txt`, `.xml`,\
      \ MIME `application/xml`.\n- **UTF‑16BE** – 16‑bit, mandatory BOM `FE FF`, extensions:\
      \ `.txt`, `.xml`, MIME `application/xml`.\n- **UTF‑32LE** – 32‑bit, mandatory\
      \ BOM `FF FE 00 00`, extension: `.txt`, MIME `text/plain`.\n- **UTF‑32BE** –\
      \ 32‑bit, mandatory BOM `00 00 FE FF`, extension: `.txt`, MIME `text/plain`.\n\
      - **UTF‑7** – 7‑bit, optional BOM, legacy `.msg` files, MIME `message/rfc822`.\n\
      - **Base64** – binary‑to‑text, no BOM, MIME `application/base64`.\n\nFor each\
      \ codec output a JSON object with the following fields:\n- `codec`: canonical\
      \ identifier string (e.g., `UTF-8`).\n- `description`: a concise technical summary\
      \ containing:\n  1. Reference standard (RFC or ISO number).\n  2. Byte‑range\
      \ or BOM presence.\n  3. Common file extensions or MIME type.\n  4. Parsing\
      \ nuances (endianness, padding, variable‑length, etc.).\n\nReturn **only** a\
      \ syntactically correct JSON array of these objects—no additional text, comments,\
      \ or formatting. This list represents the first half of the full codec catalogue;\
      \ a subsequent node will supply the remainder. The output must be ready for\
      \ downstream parsing logic."
  define_supported_codecs_part2:
    agent: false
    description: Produces the second segment of the binary parser’s codec registry.
      Enumerates additional text and binary encodings, generating an alphabetically
      sorted, syntactically correct JSON array of codec objects. Each object contains
      a unique identifier, a concise 30‑word description covering BOM handling, endianness,
      common use‑cases, and optional MIME or flag metadata, ensuring seamless integration
      with the first segment by downstream nodes.
    name: define_supported_codecs_part2
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: 'Generate a syntactically valid JSON array of codec objects for the following
      encodings: ASCII, ISO‑8859‑1, UTF‑8, UTF‑16LE, UTF‑16BE, UTF‑32LE, UTF‑32BE,
      Shift‑JIS, GB2312, ISO‑2022‑JP, Base64, Base32, Base16 (hex), URL‑safe Base64.
      For each codec object, provide:

      - `codec`: a unique identifier string (e.g., "utf-8", "base64").

      - `description`: a concise paragraph no longer than 30 words, covering BOM presence,
      typical usage, endianness handling, and any special parsing caveats.

      - Optionally `mime` and `bom` flags if relevant.

      The resulting array must be alphabetically sorted by the `codec` field and ready
      to be merged with the first segment of the codec catalog by downstream nodes.
      Do not include any additional text or commentary—output only the JSON array.'
  define_supported_numeric_types_combined:
    agent: false
    description: Merges the two partial numeric type catalogs produced by the parent
      nodes into a single canonical list. It validates that each entry contains the
      required `type` and `description` fields, removes duplicate type entries, sorts
      the list alphabetically by `type`, and emits a clean JSON array suitable for
      ingestion by the parser’s configuration system.
    name: define_supported_numeric_types_combined
    nodes_depended_on:
    - define_supported_numeric_types_part1
    - define_supported_numeric_types_part2
    nodes_dependent_on: []
    prompt: "Combine the two JSON arrays supplied by the parent nodes `define_supported_numeric_types_part1`\
      \ and `define_supported_numeric_types_part2`.\n\n1. Merge the arrays into a\
      \ single list.\n2. Validate each object: it must contain a **string** field\
      \ `type` and a **string** field `description`; discard any objects that do not\
      \ meet this criterion.\n3. Deduplicate by exact match of the `type` value—retain\
      \ only one instance of each unique `type`.\n4. Sort the resulting array alphabetically\
      \ by the `type` field.\n5. Output **only** the final JSON array. Do not include\
      \ any explanatory text, comments, or surrounding code.\n\nExample output:\n\
      ```json\n[\n  {\"type\": \"int16\", \"description\": \"signed 16‑bit little\
      \ endian integer\"},\n  {\"type\": \"uint8\", \"description\": \"unsigned 8‑bit\
      \ little endian integer\"}\n]\n```"
  define_supported_numeric_types_part1:
    agent: false
    description: Defines the exhaustive set of primitive numeric scalar types that
      the parser must detect during its initial lexing pass. It enumerates signed
      and unsigned 8, 16, 32, and 64‑bit integers, and IEEE 754 single‑ and double‑precision
      floating‑point numbers. For each type the node emits a minimal yet complete
      metadata record containing the canonical type identifier, a terse technical
      description (including sign convention, binary representation, and common application
      domains), the byte‑order requirement when applicable, and, for floating‑point
      types, the precision label. The resulting JSON array is deliberately lightweight
      and strictly typed to serve as an authoritative reference for downstream type‑validation,
      schema‑generation, and code‑generation components.
    name: define_supported_numeric_types_part1
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: 'Output the first part of the parser’s numeric‑type catalog as a strictly‑typed
      JSON array.\n\nFor each primitive scalar type you must provide the following
      properties:\n\n- **type** – the canonical identifier (e.g., `int8`, `uint16`,
      `float32`, `float64`).\n- **description** – a concise technical note that covers
      sign convention, binary encoding (two’s‑complement for integers, IEEE 754 for
      floating‑point values), and a typical application domain.\n- **byte_order**
      – either `little` or `big` when the type’s representation depends on endianness;
      omit this key for types where byte order is irrelevant (e.g., 8‑bit types or
      floating‑point precision itself).\n- **precision** – optional; present only
      for floating‑point types (`float32` → `single`, `float64` → `double`).\n\nThe
      output must be a valid JSON array of objects, each containing exactly the keys
      specified above, and **no additional keys or comments**. The array should be
      immediately consumable by downstream validation and type‑checking modules.\n\nExample
      (only for illustration; do **not** include in the output):\n```json\n[{\n  \"type\":
      \"int8\",\n  \"description\": \"Signed 8‑bit integer, two’s‑complement representation,
      used for small signed counters.\",\n  \"byte_order\": \"little\"\n}]\n```\n\nDeliver
      only the JSON array; do not prepend or append any explanatory text.'
  define_supported_numeric_types_part2:
    agent: false
    description: Generates the second segment of the parser’s numeric type catalog
      by enumerating all remaining signed and unsigned integer types and floating‑point
      types. For each type, the node emits two JSON objects—one for little‑endian
      and one for big‑endian representation—each containing a concise description
      that specifies signedness, bit width, byte order, and data category. The resulting
      array is ready for direct ingestion into the parser configuration schema.
    name: define_supported_numeric_types_part2
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: "Generate the second part of the parser’s numeric‑type catalog. The catalog\
      \ must include every remaining signed and unsigned integer type (int8, int16,\
      \ int32, int64, uint8, uint16, uint32, uint64) and floating‑point type (float32,\
      \ float64). For each type emit **two** JSON objects—one for little‑endian and\
      \ one for big‑endian representation—unless the type is explicitly endianness‑agnostic.\
      \ Each object must contain:\n\n- **type**: the exact type name, e.g., \"int16\"\
      \ or \"float64\".\n- **description**: a single, self‑contained sentence that\
      \ states the signedness (if applicable), the bit width, the byte order, and\
      \ the data category.  The format should read:\n  * \"[signedness] [bit‑width]-bit\
      \ [little/big] endian [integer/floating‑point]\".\n  * Example: \"signed 16‑bit\
      \ little endian integer\" or \"unsigned 32‑bit big endian integer\".\n  * For\
      \ floating‑point types, include the word \"floating‑point\" in the description.\n\
      \nThe output must be **one** well‑formed JSON array containing all generated\
      \ objects, with no extraneous keys or wrappers. The array is intended for direct\
      \ ingestion by the parser configuration generator. Do not add comments or formatting\
      \ that would break strict JSON parsing.\n\n**Example of a complete output**:\n\
      ```json\n[\n  {\"type\": \"int16\", \"description\": \"signed 16‑bit little\
      \ endian integer\"},\n  {\"type\": \"int16\", \"description\": \"signed 16‑bit\
      \ big endian integer\"},\n  {\"type\": \"uint32\", \"description\": \"unsigned\
      \ 32‑bit little endian integer\"},\n  {\"type\": \"uint32\", \"description\"\
      : \"unsigned 32‑bit big endian integer\"},\n  {\"type\": \"float32\", \"description\"\
      : \"floating‑point 32‑bit little endian\"},\n  {\"type\": \"float32\", \"description\"\
      : \"floating‑point 32‑bit big endian\"}\n  // …additional objects for the remaining\
      \ types…\n]\n```\nEnsure the final array includes objects for all specified\
      \ types in both endianness forms."
  design_command_line_interface_combined:
    agent: false
    description: Merges, deduplicates, and validates two partially‑designed CLI schemas
      into a single, RFC‑8259 compliant JSON definition. The node resolves flag conflicts
      by preferring the second part, logs overrides, enforces type consistency, requiredness,
      and produces a clean schema ready for consumption by downstream tooling.
    name: design_command_line_interface_combined
    nodes_depended_on:
    - design_command_line_interface_part1
    - design_command_line_interface_part2
    nodes_dependent_on: []
    prompt: "1. **Input**: Parse the JSON objects produced by `design_command_line_interface_part1`\
      \ and `design_command_line_interface_part2`.\n\n2. **Metadata Harmonisation**\n\
      \   - Verify that the `name` and `description` fields match across both parts.\
      \ If they differ, adopt the value from Part 2 and record a note in the output.\n\
      \n3. **Argument Aggregation**\n   - Concatenate the `arguments` arrays from\
      \ both parts.\n   - Deduplicate entries using the `flag` value; if `flag` is\
      \ absent, use the `long` value. When an argument appears twice, keep the Part 2\
      \ definition as the canonical form and attach a `conflict_resolution` object\
      \ containing the original Part 1 values.\n\n4. **Type & Default Verification**\n\
      \   - For each argument, ensure that the `default` value is compatible with\
      \ the declared `type` (`string`, `integer`, `boolean`, `list`). Flag a mismatch\
      \ as an error and propose a correction.\n\n5. **Requiredness Enforcement**\n\
      \   - All arguments marked `required: true` in either part must appear in the\
      \ final list. If any required argument is missing, emit an error.\n\n6. **Output\
      \ Schema**\n   - Emit a single JSON object conforming to the following structure:\n\
      \     ```json\n     {\n       \"name\": \"string\",\n       \"description\"\
      : \"string\",\n       \"arguments\": [\n         {\n           \"flag\": \"\
      string\",\n           \"short\": \"string | null\",\n           \"long\": \"\
      string | null\",\n           \"default\": <any>,\n           \"help\": \"string\"\
      ,\n           \"required\": true | false,\n           \"type\": \"string\"\n\
      \         }\n       ]\n     }\n     ```\n   - The output must be pretty‑printed\
      \ and valid per RFC‑8259.\n\n7. **Conflict Log**\n   - Append a `conflicts`\
      \ array to the final JSON summarising any overridden arguments. Each entry should\
      \ include `flag`, `original`, and `resolved` values.\n\n8. **Error Handling**\n\
      \   - If any validation rule fails, return an object containing an `errors`\
      \ array describing each issue and halt the merge. Do not produce a `conflicts`\
      \ array in this case.\n\n9. **Final Output**\n   - Return the fully consolidated\
      \ CLI definition. If errors were detected, output the `errors` array instead.\n\
      \nThe generated JSON must be free of syntax errors, ready for downstream consumption.\n"
  design_command_line_interface_part1:
    agent: false
    description: Creates an exhaustive, JSON‑serializable specification for the binary
      parser’s command‑line interface. The blueprint enumerates every flag and argument,
      their short/long forms, data types, requirement flags, defaults, help texts,
      and validation constraints drawn from the de‑duplicated codec and numeric type
      registries produced by `define_supported_codecs_combined` and `define_supported_numeric_types_combined`.
      This design guarantees consistency, prevents duplication, and supplies a ready‑to‑consume
      interface definition for downstream parsing modules.
    name: design_command_line_interface_part1
    nodes_depended_on:
    - define_supported_codecs_combined
    - define_supported_numeric_types_combined
    nodes_dependent_on: []
    prompt: "Generate a complete, RFC‑8259 compliant JSON object that specifies the\
      \ command‑line interface for the binary parser binary. The object must contain\
      \ the keys `name`, `description`, and `arguments`. For each argument, provide\
      \ the following fields:\n\n- `flag`: a concise description of the flag (e.g.,\
      \ \"Help flag\").\n- `short`: the single‑character short form (e.g., \"-h\"\
      ).\n- `long`: the multi‑character long form (e.g., \"--help\").\n- `type`: the\
      \ expected data type (`string`, `boolean`).\n- `required`: a boolean indicating\
      \ whether the argument must be supplied.\n- `default`: the default value (use\
      \ the first element from the corresponding combined list or a literal default).\n\
      - `help`: a user‑friendly help string.\n- `allowed_values`: an array listing\
      \ permissible values; for the codec and numeric type flags, populate this array\
      \ with the `codec` or `type` fields from the combined lists produced by the\
      \ dependencies.\n\nInclude the following specific arguments:\n1. Help flag:\
      \ short `-h`, long `--help`, boolean, required `false`, default `null`, help\
      \ \"Displays usage information and exits.\".\n2. Input file: short `-i`, long\
      \ `--input`, string, required `true`, default `null`, help \"Path to the binary\
      \ input file to parse.\".\n3. Codec selector: short `-c`, long `--codec`, string,\
      \ required `false`, default the first codec in `define_supported_codecs_combined`,\
      \ help \"Codec used to decode the binary. Allowed values are the codec identifiers\
      \ from the combined registry.\".\n4. Numeric type selector: short `-t`, long\
      \ `--type`, string, required `false`, default the first numeric type in `define_supported_numeric_types_combined`,\
      \ help \"Numeric type for interpreting payload data. Allowed values are the\
      \ type identifiers from the combined registry.\".\n5. Verbosity: short `-v`,\
      \ long `--verbose`, boolean, required `false`, default `false`, help \"Toggle\
      \ verbose output.\".\n6. Output format: short `-o`, long `--output-format`,\
      \ string, required `false`, default `json`, help \"Format of the parser’s output.\
      \ Allowed values are `json`, `text`, `csv`.\".\n\nThe top‑level JSON object\
      \ should look like:\n```json\n{\n  \"name\": \"binary_parser_cli\",\n  \"description\"\
      : \"A concise specification for the binary parser CLI, generated from canonical\
      \ codec and numeric type registries.\",\n  \"arguments\": [ ... ]\n}\n```\n\
      Return only the JSON object, with no additional commentary or surrounding code.\n"
  design_command_line_interface_part2:
    agent: false
    description: Defines the second stage of a binary‑parser command‑line interface,
      producing a validated, type‑safe JSON schema that enumerates all flags, positional
      arguments, defaults, and help metadata. The spec integrates canonical codec
      and numeric‑type catalogs from upstream nodes, enabling downstream tooling to
      consume a complete, extensible configuration contract for the executable.
    name: design_command_line_interface_part2
    nodes_depended_on:
    - define_supported_codecs_combined
    - define_supported_numeric_types_combined
    nodes_dependent_on: []
    prompt: "You are tasked with drafting the second stage of a robust command‑line\
      \ interface (CLI) for the binary‑parser executable. Produce a **machine‑readable\
      \ JSON schema** that fully describes every flag, positional argument, default,\
      \ and help text. The design must integrate the canonical codec list from the\
      \ node `define_supported_codecs_combined` and the numeric‑type list from `define_supported_numeric_types_combined`.\
      \ \n\n**Requirements**:\n1. Include a comprehensive help option `-h`/`--help`\
      \ that prints usage, descriptions, and defaults.\n2. Define a required positional\
      \ argument `input_file` that accepts a filesystem path.\n3. Provide an optional\
      \ codec selector `-c`/`--codec` whose admissible values are *all* codec identifiers\
      \ from `define_supported_codecs_combined`. The default should be the string\
      \ `auto`.\n4. Provide an optional numeric type selector `-t`/`--type` whose\
      \ admissible values are *all* types from `define_supported_numeric_types_combined`.\
      \ The default should be the string `auto`.\n5. Add a verbosity flag `-v`/`--verbose`\
      \ (boolean, default `false`).\n6. Add an output format flag `-o`/`--output-format`\
      \ accepting either `json` or `yaml` (default `json`).\n7. For each argument,\
      \ include the following metadata fields:\n   * `flag` – combined short and long\
      \ form or positional name;\n   * `short` – short form or `null`;\n   * `long`\
      \ – long form or `null`;\n   * `required` – `true` or `false`;\n   * `default`\
      \ – value or `null`;\n   * `type` – `boolean`, `string`, or `enum`;\n   * `help`\
      \ – concise description.\n8. The output JSON must exactly match the following\
      \ structure:\n\n```json\n{\n  \"name\": \"binary_parser_cli\",\n  \"description\"\
      : \"A lightweight CLI for the binary parser binary.\",\n  \"arguments\": [\n\
      \    {\n      \"flag\": \"-h, --help\",\n      \"short\": \"-h\",\n      \"\
      long\": \"--help\",\n      \"required\": false,\n      \"default\": null,\n\
      \      \"type\": \"boolean\",\n      \"help\": \"Display help information and\
      \ exit.\"\n    },\n    {\n      \"flag\": \"input_file\",\n      \"short\":\
      \ null,\n      \"long\": null,\n      \"required\": true,\n      \"default\"\
      : null,\n      \"type\": \"string\",\n      \"help\": \"Path to the binary file\
      \ to parse.\"\n    },\n    {\n      \"flag\": \"-c, --codec\",\n      \"short\"\
      : \"-c\",\n      \"long\": \"--codec\",\n      \"required\": false,\n      \"\
      default\": \"auto\",\n      \"type\": \"enum\",\n      \"help\": \"Select codec\
      \ to decode; choices: <CODEC_LIST>.\"\n    },\n    {\n      \"flag\": \"-t,\
      \ --type\",\n      \"short\": \"-t\",\n      \"long\": \"--type\",\n      \"\
      required\": false,\n      \"default\": \"auto\",\n      \"type\": \"enum\",\n\
      \      \"help\": \"Specify numeric type for parsed values; choices: <TYPE_LIST>.\"\
      \n    },\n    {\n      \"flag\": \"-v, --verbose\",\n      \"short\": \"-v\"\
      ,\n      \"long\": \"--verbose\",\n      \"required\": false,\n      \"default\"\
      : false,\n      \"type\": \"boolean\",\n      \"help\": \"Increase verbosity\
      \ of runtime logs.\"\n    },\n    {\n      \"flag\": \"-o, --output-format\"\
      ,\n      \"short\": \"-o\",\n      \"long\": \"--output-format\",\n      \"\
      required\": false,\n      \"default\": \"json\",\n      \"type\": \"enum\",\n\
      \      \"help\": \"Output format for parsed data; either json or yaml.\"\n \
      \   }\n  ]\n}\n```\n\n**Note**: Replace `<CODEC_LIST>` with a comma‑separated\
      \ list of every codec identifier obtained from `define_supported_codecs_combined`.\
      \ Replace `<TYPE_LIST>` with a comma‑separated list of every numeric type identifier\
      \ from `define_supported_numeric_types_combined`. Ensure the resulting JSON\
      \ is syntactically valid and contains no extraneous keys or comments.\n\nOutput\
      \ ONLY the JSON object described above; do not add any surrounding text or commentary."
  document_command_line_tool_combined:
    agent: false
    description: Consolidates the independently generated CLI documentation fragments
      into a single, authoritative reference guide.  The node reconciles overlapping
      sections, resolves conflicting option descriptions, standardizes Markdown formatting,
      and enriches the output with a structured table of contents, metadata headers,
      and release notes, producing a clean, production‑ready manual.
    name: document_command_line_tool_combined
    nodes_depended_on:
    - document_command_line_tool_part1
    - document_command_line_tool_part2
    nodes_dependent_on: []
    prompt: "Produce a single, unified Markdown documentation file that merges the\
      \ two provided fragments.  \n\n**Processing steps**:\n1. **Parse** both fragments\
      \ into logical sections (Overview, Syntax, Options, Examples, Troubleshooting,\
      \ etc.).  \n2. **Identify duplicates** or overlapping option descriptions. \
      \ \n3. **Resolve conflicts** by choosing the most recent or most detailed version;\
      \ where ambiguity remains, include both with clear annotations.  \n4. **Generate\
      \ a hierarchical table of contents** that lists all commands, sub‑commands,\
      \ options, and major sections with correct Markdown link targets.  \n5. **Standardize\
      \ formatting**:  \n   * Use consistent heading levels (`#`, `##`, `###`).  \n\
      \   * Reformat all code fences, bullet lists, and tables to a single style.\
      \  \n   * Ensure links are valid and use absolute URLs where appropriate.  \n\
      6. **Append metadata** at the top:  \n   * `CLI Tool vX.Y`  \n   * Build date\
      \ (ISO 8601)  \n   * Author, license, and a brief release note.  \n7. **Validate\
      \ completeness**:  \n   * All examples must be runnable syntax.  \n   * Option\
      \ tables include columns: Option, Short form, Default, Type, Description, Allowed\
      \ values.  \n   * Troubleshooting section references the correct error codes.\
      \  \n8. **Return** only the final Markdown document as plain text, ready for\
      \ direct insertion into a README or manual page."
  document_command_line_tool_part1:
    agent: false
    description: Generates the foundational, fully‑structured documentation segment
      for a command‑line utility. It defines the tool’s role, usage syntax, flag table,
      codec support, numeric argument handling, practical examples, common error scenarios
      and troubleshooting guidance, and platform‑specific notes. The output is a ready‑to‑embed
      Markdown string for inclusion in README files or man pages.
    name: document_command_line_tool_part1
    nodes_depended_on:
    - design_command_line_interface_combined
    nodes_dependent_on: []
    prompt: "Part 1: Draft a complete, professional‑grade documentation block for\
      \ the command‑line tool.\n\n**Structure**\n- Use Markdown headings (`##`, `###`,\
      \ `####`), code fences for commands, and a table for the options list.\n- Ensure\
      \ each section is clearly labeled and logically ordered.\n\n**Contents to include**\n\
