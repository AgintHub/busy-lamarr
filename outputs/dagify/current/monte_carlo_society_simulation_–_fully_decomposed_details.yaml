dag_type: plain_text
description: A highly granular workflow where every high‑level operation is broken
  into atomic steps with explicit dependencies, providing maximal detail and concurrency.
name: monte_carlo_society_simulation_–_fully_decomposed
nodes:
  align_by_state_time:
    agent: false
    description: Align all runs by state and time step for aggregation.
    name: align_by_state_time
    nodes_depended_on:
    - read_run_files
    nodes_dependent_on: []
    prompt: Organize the extracted data so that each state has a matrix of daily values
      across all runs.
  assemble_report:
    agent: false
    description: Combine executive summary, methodology, findings, visualizations,
      and recommendations into a final report document.
    name: assemble_report
    nodes_depended_on:
    - write_executive_summary
    - write_methodology
    - write_key_findings
    - assemble_visualizations
    - write_recommendations
    nodes_dependent_on: []
    prompt: Create a single PDF report (max 2000 words) that includes all sections
      and embeds the PNG visualizations.
  assemble_state_demographics:
    agent: false
    description: Combine demographic attribute CSVs into a single unified demographics
      table.
    name: assemble_state_demographics
    nodes_depended_on:
    - collect_population
    - collect_median_age
    - collect_percent_urban
    - collect_percent_bachelors
    nodes_dependent_on: []
    prompt: 'Merge the four CSV files from the demographic collection steps into one
      CSV with columns: State, Population, MedianAge, PercentUrban, PercentBachelors.'
  assemble_state_economic_data:
    agent: false
    description: Combine all economic attribute CSVs into a single economic dataset.
    name: assemble_state_economic_data
    nodes_depended_on:
    - collect_gdp
    - collect_unemployment_rate
    - collect_median_income
    - collect_top_industry1
    - collect_top_industry2
    - collect_top_industry3
    nodes_dependent_on: []
    prompt: 'Merge the six CSV files from the economic collection steps into one CSV
      with columns: State, GDP, UnemploymentRate, MedianIncome, TopIndustry1, TopIndustry2,
      TopIndustry3.'
  assemble_state_environmental_params:
    agent: false
    description: Combine environmental attribute CSVs into one dataset.
    name: assemble_state_environmental_params
    nodes_depended_on:
    - collect_avg_temp
    - collect_aqi
    - collect_renewable_pct
    - collect_forest_cover_pct
    nodes_dependent_on: []
    prompt: 'Merge the four environmental CSV files into a single CSV with columns:
      State, AvgTempC, AvgAQI, RenewableEnergyPct, ForestCoverPct.'
  assemble_state_health_metrics:
    agent: false
    description: Combine health attribute CSVs into a single health dataset.
    name: assemble_state_health_metrics
    nodes_depended_on:
    - collect_life_expectancy
    - collect_obesity_pct
    - collect_vaccination_pct
    - collect_hospital_beds_perk
    nodes_dependent_on: []
    prompt: 'Merge the four health CSV files into a single CSV with columns: State,
      LifeExpectancy, ObesityPct, VaccinationPct, HospitalBedsPerK.'
  assemble_state_political_structure:
    agent: false
    description: Combine political attribute CSVs into a single political dataset.
    name: assemble_state_political_structure
    nodes_depended_on:
    - collect_governor_party
    - collect_legislature_democrat_pct
    - collect_legislature_republican_pct
    - collect_voter_turnout_pct
    nodes_dependent_on: []
    prompt: 'Merge the four political CSV files into a single CSV with columns: State,
      GovernorParty, LegislatureDemocratPct, LegislatureRepublicanPct, VoterTurnoutPct.'
  assemble_visualizations:
    agent: false
    description: Collect all generated PNG visualizations into a single assets folder.
    name: assemble_visualizations
    nodes_depended_on:
    - visualize_gdp_line_plot
    - visualize_health_heatmap
    - visualize_political_bar_chart
    nodes_dependent_on: []
    prompt: Move the three PNG files into ./visualizations/ and list their filenames.
  calculate_confidence_intervals:
    agent: false
    description: Calculate 95% confidence intervals for each metric using aggregated
      statistics.
    name: calculate_confidence_intervals
    nodes_depended_on:
    - produce_aggregated_csv
    nodes_dependent_on: []
    prompt: For each metric, compute the 95% confidence interval based on mean and
      standard deviation.
  collect_aqi:
    agent: false
    description: Collect average Air Quality Index for each state.
    name: collect_aqi
    nodes_depended_on:
    - define_state_list
    nodes_dependent_on: []
    prompt: 'For each state abbreviation, retrieve the average AQI. Produce a CSV
      with columns: State, AvgAQI.'
  collect_avg_temp:
    agent: false
    description: Collect average annual temperature for each state.
    name: collect_avg_temp
    nodes_depended_on:
    - define_state_list
    nodes_dependent_on: []
    prompt: 'For each state abbreviation, retrieve the average annual temperature
      in Celsius. Produce a CSV with columns: State, AvgTempC.'
  collect_forest_cover_pct:
    agent: false
    description: Collect total forest cover percentage for each state.
    name: collect_forest_cover_pct
    nodes_depended_on:
    - define_state_list
    nodes_dependent_on: []
    prompt: 'For each state abbreviation, retrieve the forest cover percentage. Produce
      a CSV with columns: State, ForestCoverPct.'
  collect_gdp:
    agent: false
    description: Collect Gross Domestic Product for each state.
    name: collect_gdp
    nodes_depended_on:
    - define_state_list
    nodes_dependent_on: []
    prompt: 'For each state abbreviation, retrieve the latest GDP figure. Produce
      a CSV with columns: State, GDP.'
  collect_governor_party:
    agent: false
    description: Collect the political party of each state’s governor.
    name: collect_governor_party
    nodes_depended_on:
    - define_state_list
    nodes_dependent_on: []
    prompt: 'For each state abbreviation, retrieve the governor’s party affiliation.
      Produce a CSV with columns: State, GovernorParty.'
  collect_hospital_beds_perk:
    agent: false
    description: Collect number of hospital beds per 1,000 residents for each state.
    name: collect_hospital_beds_perk
    nodes_depended_on:
    - define_state_list
    nodes_dependent_on: []
    prompt: 'For each state abbreviation, retrieve hospital beds per 1,000 residents.
      Produce a CSV with columns: State, HospitalBedsPerK.'
  collect_legislature_democrat_pct:
    agent: false
    description: Collect percentage of Democratic seats in each state legislature.
    name: collect_legislature_democrat_pct
    nodes_depended_on:
    - define_state_list
    nodes_dependent_on: []
    prompt: 'For each state abbreviation, retrieve the percent of legislative seats
      held by Democrats. Produce a CSV with columns: State, LegislatureDemocratPct.'
  collect_legislature_republican_pct:
    agent: false
    description: Collect percentage of Republican seats in each state legislature.
    name: collect_legislature_republican_pct
    nodes_depended_on:
    - define_state_list
    nodes_dependent_on: []
    prompt: 'For each state abbreviation, retrieve the percent of legislative seats
      held by Republicans. Produce a CSV with columns: State, LegislatureRepublicanPct.'
  collect_life_expectancy:
    agent: false
    description: Collect average life expectancy for each state.
    name: collect_life_expectancy
    nodes_depended_on:
    - define_state_list
    nodes_dependent_on: []
    prompt: 'For each state abbreviation, retrieve life expectancy. Produce a CSV
      with columns: State, LifeExpectancy.'
  collect_median_age:
    agent: false
    description: Gather the median age for each state.
    name: collect_median_age
    nodes_depended_on:
    - define_state_list
    nodes_dependent_on: []
    prompt: 'For each state abbreviation, retrieve the median age. Produce a CSV with
      columns: State, MedianAge.'
  collect_median_income:
    agent: false
    description: Collect median household income for each state.
    name: collect_median_income
    nodes_depended_on:
    - define_state_list
    nodes_dependent_on: []
    prompt: 'For each state abbreviation, retrieve the median household income. Produce
      a CSV with columns: State, MedianIncome.'
  collect_obesity_pct:
    agent: false
    description: Collect obesity prevalence percentage for each state.
    name: collect_obesity_pct
    nodes_depended_on:
    - define_state_list
    nodes_dependent_on: []
    prompt: 'For each state abbreviation, retrieve obesity prevalence as a percent.
      Produce a CSV with columns: State, ObesityPct.'
  collect_percent_bachelors:
    agent: false
    description: Gather the percentage of adults with a bachelor's degree or higher
      for each state.
    name: collect_percent_bachelors
    nodes_depended_on:
    - define_state_list
    nodes_dependent_on: []
    prompt: 'For each state abbreviation, retrieve the education attainment (percent
      with bachelor''s degree or higher). Produce a CSV with columns: State, PercentBachelors.'
  collect_percent_urban:
    agent: false
    description: Gather the percentage of the population living in urban areas for
      each state.
    name: collect_percent_urban
    nodes_depended_on:
    - define_state_list
    nodes_dependent_on: []
    prompt: 'For each state abbreviation, retrieve the urban‑rural split expressed
      as percent urban. Produce a CSV with columns: State, PercentUrban.'
  collect_population:
    agent: false
    description: Gather the latest total population for each state.
    name: collect_population
    nodes_depended_on:
    - define_state_list
    nodes_dependent_on: []
    prompt: 'For each state abbreviation, retrieve the most recent population figure.
      Produce a CSV with columns: State, Population.'
  collect_renewable_pct:
    agent: false
    description: Collect the share of renewable energy in total electricity generation
      for each state.
    name: collect_renewable_pct
    nodes_depended_on:
    - define_state_list
    nodes_dependent_on: []
    prompt: 'For each state abbreviation, retrieve renewable energy percentage of
      total electricity. Produce a CSV with columns: State, RenewableEnergyPct.'
  collect_top_industry1:
    agent: false
    description: Collect the top industry sector for each state (rank 1).
    name: collect_top_industry1
    nodes_depended_on:
    - define_state_list
    nodes_dependent_on: []
    prompt: 'For each state abbreviation, identify the leading industry sector. Produce
      a CSV with columns: State, TopIndustry1.'
  collect_top_industry2:
    agent: false
    description: Collect the second‑most important industry sector for each state.
    name: collect_top_industry2
    nodes_depended_on:
    - define_state_list
    nodes_dependent_on: []
    prompt: 'For each state abbreviation, identify the second‑ranked industry sector.
      Produce a CSV with columns: State, TopIndustry2.'
  collect_top_industry3:
    agent: false
    description: Collect the third‑most important industry sector for each state.
    name: collect_top_industry3
    nodes_depended_on:
    - define_state_list
    nodes_dependent_on: []
    prompt: 'For each state abbreviation, identify the third‑ranked industry sector.
      Produce a CSV with columns: State, TopIndustry3.'
  collect_unemployment_rate:
    agent: false
    description: Collect the unemployment rate for each state.
    name: collect_unemployment_rate
    nodes_depended_on:
    - define_state_list
    nodes_dependent_on: []
    prompt: 'For each state abbreviation, retrieve the current unemployment rate.
      Produce a CSV with columns: State, UnemploymentRate.'
  collect_vaccination_pct:
    agent: false
    description: Collect COVID‑19 vaccination rate for each state.
    name: collect_vaccination_pct
    nodes_depended_on:
    - define_state_list
    nodes_dependent_on: []
    prompt: 'For each state abbreviation, retrieve the percentage of the population
      fully vaccinated. Produce a CSV with columns: State, VaccinationPct.'
  collect_voter_turnout_pct:
    agent: false
    description: Collect latest voter turnout percentage for each state.
    name: collect_voter_turnout_pct
    nodes_depended_on:
    - define_state_list
    nodes_dependent_on: []
    prompt: 'For each state abbreviation, retrieve the most recent voter turnout percentage.
      Produce a CSV with columns: State, VoterTurnoutPct.'
  combine_agent_spec:
    agent: false
    description: Combine all agent attribute specifications into a complete agent
      model definition.
    name: combine_agent_spec
    nodes_depended_on:
    - spec_agent_age
    - spec_agent_education
    - spec_agent_employment
    - spec_agent_income
    - spec_agent_health
    - spec_agent_political_preference
    - spec_agent_location
    nodes_dependent_on: []
    prompt: Aggregate the seven attribute specifications into a single concise agent
      model description.
  combine_economic_model:
    agent: false
    description: Combine production and labor market formulas into a macro‑economic
      model.
    name: combine_economic_model
    nodes_depended_on:
    - formula_production_function
    - formula_labor_market_eq
    nodes_dependent_on: []
    prompt: Aggregate the two formulas into a single economic model description.
  combine_environmental_rules:
    agent: false
    description: Combine environmental impact rules into a unified environmental model.
    name: combine_environmental_rules
    nodes_depended_on:
    - rule_temp_aqi_health
    - rule_renewable_productivity
    nodes_dependent_on: []
    prompt: Merge the two environmental rules into a single environmental model specification.
  combine_health_model:
    agent: false
    description: Combine S‑I‑R and mortality formulas into a comprehensive health
      model.
    name: combine_health_model
    nodes_depended_on:
    - compartmental_sir_update
    - formula_mortality_risk
    nodes_dependent_on: []
    prompt: Aggregate the two health formulas into a single health model description.
  combine_interaction_rules:
    agent: false
    description: Combine all interaction rules into a unified interaction model.
    name: combine_interaction_rules
    nodes_depended_on:
    - rule_economic_transactions
    - rule_information_exchange
    - rule_disease_transmission
    nodes_dependent_on: []
    prompt: Merge the three interaction rules into a single interaction model specification.
  combine_political_model:
    agent: false
    description: Combine the voting equation into a full political decision‑making
      model.
    name: combine_political_model
    nodes_depended_on:
    - voting_model_equation
    nodes_dependent_on: []
    prompt: Wrap the voting equation into a concise political model description.
  compartmental_sir_update:
    agent: false
    description: Provide the S‑I‑R update rule for each agent.
    name: compartmental_sir_update
    nodes_depended_on:
    - assemble_state_health_metrics
    nodes_dependent_on: []
    prompt: Write a compact S‑I‑R update formula where transmission probability depends
      on population density and vaccination rate.
  compute_means:
    agent: false
    description: Compute mean values for each metric across runs.
    name: compute_means
    nodes_depended_on:
    - align_by_state_time
    nodes_dependent_on: []
    prompt: Calculate the average of each metric (GDP, unemployment, health index,
      political composition) for every state and day.
  compute_stddevs:
    agent: false
    description: Compute standard deviation for each metric across runs.
    name: compute_stddevs
    nodes_depended_on:
    - align_by_state_time
    nodes_dependent_on: []
    prompt: Calculate the standard deviation of each metric for every state and day.
  define_simulation_objectives:
    agent: false
    description: Specify the high‑level goals and key metrics for the Monte Carlo
      simulation.
    name: define_simulation_objectives
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: List the primary objectives (e.g., forecast economic output, political
      stability, health outcomes) and the exact metric names that will be tracked
      per state.
  define_state_list:
    agent: false
    description: Create a master list of all U.S. states (50 two‑letter abbreviations).
    name: define_state_list
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Return a plain‑text list of the 50 U.S. state abbreviations, one per line.
  formula_labor_market_eq:
    agent: false
    description: Provide the labor market equation linking employment to unemployment
      rate.
    name: formula_labor_market_eq
    nodes_depended_on:
    - assemble_state_economic_data
    nodes_dependent_on: []
    prompt: Express a concise symbolic equation for unemployment rate as a function
      of labor supply and demand.
  formula_mortality_risk:
    agent: false
    description: Provide the mortality risk formula based on age and obesity.
    name: formula_mortality_risk
    nodes_depended_on:
    - assemble_state_health_metrics
    nodes_dependent_on: []
    prompt: Express a concise mortality risk equation using age and obesity percentage
      as variables.
  formula_production_function:
    agent: false
    description: Provide the production function linking aggregate income to state
      GDP.
    name: formula_production_function
    nodes_depended_on:
    - assemble_state_economic_data
    nodes_dependent_on: []
    prompt: Express a concise symbolic production function (e.g., GDP = A * (TotalIncome)^β).
  generate_random_seed:
    agent: false
    description: Produce a 64‑bit cryptographically secure random integer.
    name: generate_random_seed
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Generate a 64‑bit integer using a secure random source and output it as
      plain text.
  generate_random_seeds_batch:
    agent: false
    description: Create a list of 1,000 independent random seeds.
    name: generate_random_seeds_batch
    nodes_depended_on:
    - generate_random_seed
    nodes_dependent_on: []
    prompt: Generate 1,000 distinct 64‑bit random integers and store them in a text
      file.
  identify_significant_differences:
    agent: false
    description: Identify statistically significant differences between states for
      each metric.
    name: identify_significant_differences
    nodes_depended_on:
    - produce_aggregated_csv
    nodes_dependent_on: []
    prompt: Perform pairwise comparisons of state means and flag differences with
      p‑value < 0.05.
  init_simulation_state:
    agent: false
    description: Initialize the full simulation state using all model specifications
      and a random seed.
    name: init_simulation_state
    nodes_depended_on:
    - combine_agent_spec
    - combine_interaction_rules
    - combine_economic_model
    - combine_environmental_rules
    - combine_health_model
    - combine_political_model
    - generate_random_seed
    nodes_dependent_on: []
    prompt: Create the initial data structures for agents, state metrics, and stochastic
      seeds based on the combined models.
  invoke_simulation_instances:
    agent: false
    description: Launch 1,000 parallel simulation runs using distinct seeds.
    name: invoke_simulation_instances
    nodes_depended_on:
    - run_one_simulation_instance
    - generate_random_seeds_batch
    nodes_dependent_on: []
    prompt: For each seed in the batch file, execute run_one_simulation_instance and
      name the output run_###.json.
  output_compressed_json:
    agent: false
    description: Write the full simulation time‑series to a compressed JSON file.
    name: output_compressed_json
    nodes_depended_on:
    - record_time_series
    nodes_dependent_on: []
    prompt: Serialize the recorded time‑series into a JSON object and compress it
      (e.g., zip) into a single file named run_XXX.json.
  produce_aggregated_csv:
    agent: false
    description: Generate a CSV file containing mean and standard deviation for each
      metric by state and day.
    name: produce_aggregated_csv
    nodes_depended_on:
    - compute_means
    - compute_stddevs
    nodes_dependent_on: []
    prompt: 'Create a CSV with columns: State, Day, Metric, Mean, StdDev using the
      computed statistics.'
  read_run_files:
    agent: false
    description: Read all JSON files generated by the simulation batch.
    name: read_run_files
    nodes_depended_on:
    - store_batch_outputs
    nodes_dependent_on: []
    prompt: Load each run_###.json file and extract the state‑level time‑series data.
  record_time_series:
    agent: false
    description: Record state‑level time‑series data for key metrics during the simulation.
    name: record_time_series
    nodes_depended_on:
    - simulate_daily_steps
    nodes_dependent_on: []
    prompt: Capture daily values of GDP, unemployment, health index, and political
      composition for each state and store them in a structured format.
  rule_disease_transmission:
    agent: false
    description: Define the daily disease‑transmission rule between agents.
    name: rule_disease_transmission
    nodes_depended_on:
    - combine_agent_spec
    nodes_dependent_on: []
    prompt: Write a one‑sentence rule describing how infection spreads based on proximity
      and vaccination status.
  rule_economic_transactions:
    agent: false
    description: Define the daily economic transaction rule between agents.
    name: rule_economic_transactions
    nodes_depended_on:
    - combine_agent_spec
    nodes_dependent_on: []
    prompt: Write a one‑sentence rule describing how agents exchange money based on
      employment status and income.
  rule_information_exchange:
    agent: false
    description: Define the daily information‑exchange rule between agents.
    name: rule_information_exchange
    nodes_depended_on:
    - combine_agent_spec
    nodes_dependent_on: []
    prompt: Write a one‑sentence rule describing how agents share political preferences
      with their contacts.
  rule_renewable_productivity:
    agent: false
    description: Define how renewable energy share influences economic productivity.
    name: rule_renewable_productivity
    nodes_depended_on:
    - assemble_state_environmental_params
    nodes_dependent_on: []
    prompt: Write an “If … then …” rule that boosts productivity when renewable energy
      share exceeds a threshold.
  rule_temp_aqi_health:
    agent: false
    description: Define how temperature and AQI affect individual health outcomes.
    name: rule_temp_aqi_health
    nodes_depended_on:
    - assemble_state_environmental_params
    nodes_dependent_on: []
    prompt: Write an “If … then …” rule linking high temperature or poor AQI to increased
      health risk.
  run_one_simulation_instance:
    agent: false
    description: Execute a single Monte Carlo simulation run end‑to‑end.
    name: run_one_simulation_instance
    nodes_depended_on:
    - init_simulation_state
    nodes_dependent_on: []
    prompt: Combine init, daily simulation, recording, and JSON output steps to produce
      one full run file.
  simulate_daily_steps:
    agent: false
    description: Run the daily simulation loop for all agents across all states.
    name: simulate_daily_steps
    nodes_depended_on:
    - init_simulation_state
    nodes_dependent_on: []
    prompt: Iterate 10 years of daily steps, applying interaction, economic, environmental,
      health, and political rules each day.
  spec_agent_age:
    agent: false
    description: Specify how an agent’s age attribute is initialized from demographic
      data.
    name: spec_agent_age
    nodes_depended_on:
    - assemble_state_demographics
    - define_simulation_objectives
    nodes_dependent_on: []
    prompt: Define a rule that assigns each agent an age drawn from the age distribution
      implied by the median age of the state’s population.
  spec_agent_education:
    agent: false
    description: Specify how an agent’s education level is initialized.
    name: spec_agent_education
    nodes_depended_on:
    - assemble_state_demographics
    - define_simulation_objectives
    nodes_dependent_on: []
    prompt: Define a rule that assigns each agent an education level based on the
      state’s percent with bachelor’s degrees.
  spec_agent_employment:
    agent: false
    description: Specify how an agent’s employment status is initialized.
    name: spec_agent_employment
    nodes_depended_on:
    - assemble_state_demographics
    - define_simulation_objectives
    nodes_dependent_on: []
    prompt: Define a rule that sets employment status using the state’s unemployment
      rate as the probability of being unemployed.
  spec_agent_health:
    agent: false
    description: Specify how an agent’s health status is initialized.
    name: spec_agent_health
    nodes_depended_on:
    - assemble_state_health_metrics
    - define_simulation_objectives
    nodes_dependent_on: []
    prompt: Define a rule that initializes health status using the state’s life expectancy
      and obesity prevalence.
  spec_agent_income:
    agent: false
    description: Specify how an agent’s income attribute is initialized.
    name: spec_agent_income
    nodes_depended_on:
    - assemble_state_demographics
    - define_simulation_objectives
    nodes_dependent_on: []
    prompt: Define a rule that assigns income values proportionally to the state’s
      median household income.
  spec_agent_location:
    agent: false
    description: Specify how an agent’s location (state) is assigned.
    name: spec_agent_location
    nodes_depended_on:
    - define_state_list
    - define_simulation_objectives
    nodes_dependent_on: []
    prompt: Define a rule that randomly assigns each agent to one of the listed states,
      respecting the state population sizes.
  spec_agent_political_preference:
    agent: false
    description: Specify how an agent’s political preference is initialized.
    name: spec_agent_political_preference
    nodes_depended_on:
    - assemble_state_political_structure
    - define_simulation_objectives
    nodes_dependent_on: []
    prompt: Define a rule that assigns political preference based on the governor’s
      party and legislative composition percentages.
  store_batch_outputs:
    agent: false
    description: Collect all run_###.json files into a designated output directory.
    name: store_batch_outputs
    nodes_depended_on:
    - invoke_simulation_instances
    nodes_dependent_on: []
    prompt: Ensure every generated run_###.json file is saved in the ./batch_outputs/
      folder.
  summarize_findings:
    agent: false
    description: Summarize key statistical findings in a bullet‑point list.
    name: summarize_findings
    nodes_depended_on:
    - calculate_confidence_intervals
    - identify_significant_differences
    nodes_dependent_on: []
    prompt: Write concise bullet points describing the most notable confidence intervals
      and significant state differences.
  visualize_gdp_line_plot:
    agent: false
    description: Create a line plot of average GDP over time for the top 5 states.
    name: visualize_gdp_line_plot
    nodes_depended_on:
    - produce_aggregated_csv
    nodes_dependent_on: []
    prompt: Generate a PNG line chart showing daily average GDP for the five states
      with highest mean GDP.
  visualize_health_heatmap:
    agent: false
    description: Create a heat map of average health index by state.
    name: visualize_health_heatmap
    nodes_depended_on:
    - produce_aggregated_csv
    nodes_dependent_on: []
