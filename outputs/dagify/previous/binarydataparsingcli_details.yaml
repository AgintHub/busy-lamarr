      \    --------\n    >>> def apply_codecs(supported_codecs, binary_data_reader_function):\n\
      \    ...     # Example implementation\n    ...     code_snippet = ''\n    ...\
      \     for codec in supported_codecs:\n    ...         code_snippet += f'data\
