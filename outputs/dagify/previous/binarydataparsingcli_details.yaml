  implementnumericinterpretation:
    agent: false
    code_node_type: stub
    description: Implement the interpretation of binary data as different numeric
      types
    implementation: "from pydantic import BaseModel, Field\nfrom typing import List\n\
      \n\nimport numpy as np\n\n\nclass DefinenumericinterpretationsOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for definenumericinterpretations node outputs.\"\"\
      \"\n    numeric_interpretations: List[str] = (\n        Field(..., description=\"\
      List of numeric interpretations supported\")\n    )\n\n\nclass ImplementbinarydatareaderOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for implementbinarydatareader node outputs.\"\"\"\n\
      \    binary_data_reader_function: str = (\n        Field(..., description=\"\
      Name of the function that reads binary data\")\n    )\n\n\nclass ImplementnumericinterpretationOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for implementnumericinterpretation node outputs.\"\
      \"\"\n    numeric_interpretation_code: str = (\n        Field(..., description=\"\
      Code snippet for numeric interpretation\")\n    )\n\n\ndef implementnumericinterpretation(definenumericinterpretations_input:\
      \ DefinenumericinterpretationsOutput, implementbinarydatareader_input: ImplementbinarydatareaderOutput,\
      \ **kwargs) -> ImplementnumericinterpretationOutput:\n    \"\"\"\n    Generates\
      \ code for interpreting binary data as different numeric types.\n\n    Parameters\n\
      \    ----------\n    numeric_interpretations : List[str]\n        List of numeric\
      \ interpretations supported, provided by\n        'definenumericinterpretations'.\n\
      \    binary_data_reader_function : str\n        Name of the function that reads\
      \ binary data, provided by\n        'implementbinarydatareader'.\n\n    Returns\n\
      \    -------\n    str\n        Code snippet that interprets binary data as the\
      \ defined numeric\n        types.\n\n    Raises\n    ------\n    ValueError\n\
      \        If numeric_interpretations is empty or binary_data_reader_function\n\
      \        is not a valid function name.\n\n    Examples\n    --------\n    >>>\
      \ numeric_interpretations = ['int8', 'uint16', 'float32']\n    >>> binary_data_reader_function\
      \ = 'read_binary_data'\n    >>> interpret_binary_data(numeric_interpretations,\n\
      \    binary_data_reader_function)\n    \"\"\"\n    def interpret_binary_data(data,\
      \ interpretation):\n        if interpretation == 'int8':\n            return\
      \ np.frombuffer(data, dtype=np.int8)\n        elif interpretation == 'uint16':\n\
      \            return np.frombuffer(data, dtype=np.uint16)\n        elif interpretation\
      \ == 'float32':\n            return np.frombuffer(data, dtype=np.float32)\n\
      \        else:\n            raise ValueError('Unsupported interpretation')\n\
      \    \"\"\"\n\n    \"\"\"\n    return ImplementnumericinterpretationOutput(\n\
      \        numeric_interpretation_code=\"\",\n    )"
    name: implementnumericinterpretation
    nodes_depended_on:
    - definenumericinterpretations
    - implementbinarydatareader
    nodes_dependent_on: []
    output_structure:
    - description: Code snippet for numeric interpretation
      key: numeric_interpretation_code
      type: str
    prd:
      conceptual_info: This node generates code to interpret binary data as various
        numeric types defined in the 'definenumericinterpretations' node, using the
        binary data reader function from 'implementbinarydatareader'.
      docstring:
        examples:
        - lines:
          - numeric_interpretations = ['int8', 'uint16', 'float32']
          - binary_data_reader_function = 'read_binary_data'
          - interpret_binary_data(numeric_interpretations, binary_data_reader_function)
          output: "\"\"\"\nimport numpy as np\ndef interpret_binary_data(data, interpretation):\n\
            \    if interpretation == 'int8':\n        return np.frombuffer(data,\
            \ dtype=np.int8)\n    elif interpretation == 'uint16':\n        return\
            \ np.frombuffer(data, dtype=np.uint16)\n    elif interpretation == 'float32':\n\
            \        return np.frombuffer(data, dtype=np.float32)\n    else:\n   \
            \     raise ValueError('Unsupported interpretation')\n\"\"\""
        parameters:
        - description: List of numeric interpretations supported, provided by 'definenumericinterpretations'.
          name: numeric_interpretations
          type: List[str]
        - description: Name of the function that reads binary data, provided by 'implementbinarydatareader'.
          name: binary_data_reader_function
          type: str
        raises:
        - description: If numeric_interpretations is empty or binary_data_reader_function
            is not a valid function name.
          type: ValueError
        returns:
          description: Code snippet that interprets binary data as the defined numeric
            types.
          type: str
        summary: Generates code for interpreting binary data as different numeric
          types.
    prompt: Develop code to interpret binary data as the defined numeric types
    shims: []
