  designcommandlineinterface:
    agent: false
    code_node_type: stub
    description: Design the CLI syntax for specifying binary data files, codecs, and
      numeric interpretations
    implementation: "from pydantic import BaseModel, Field\nfrom typing import List\n\
      \n\nclass DefinesupportedcodecsOutput(BaseModel):\n    \"\"\"Pydantic model\
      \ for definesupportedcodecs node outputs.\"\"\"\n    supported_codecs: List[str]\
      \ = (\n        Field(..., description=\"List of codec names supported by the\
      \ CLI tool\")\n    )\n\n\nclass DefinenumericinterpretationsOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for definenumericinterpretations node outputs.\"\"\
      \"\n    numeric_interpretations: List[str] = (\n        Field(..., description=\"\
      List of numeric interpretations supported\")\n    )\n\n\nclass DesigncommandlineinterfaceOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for designcommandlineinterface node outputs.\"\"\"\
      \n    cli_syntax: str = Field(..., description=\"Command line syntax description\"\
      )\n    cli_options: str = Field(..., description=\"List of CLI options available\"\
      )\n\n\ndef designcommandlineinterface(definesupportedcodecs_input: DefinesupportedcodecsOutput,\
      \ definenumericinterpretations_input: DefinenumericinterpretationsOutput, **kwargs)\
      \ -> DesigncommandlineinterfaceOutput:\n    \"\"\"\n    Designs the CLI syntax\
      \ for specifying binary data files, codecs, and numeric\n    interpretations.\n\
      \n    Parameters\n    ----------\n    supported_codecs : List[str]\n       \
      \ List of codec names supported by the CLI tool, provided by the\n        'definesupportedcodecs'\
      \ node.\n    numeric_interpretations : List[str]\n        List of numeric interpretations\
      \ supported by the CLI tool, provided\n        by the 'definenumericinterpretations'\
      \ node.\n\n    Returns\n    -------\n    Tuple[str, List[str]]\n        A tuple\
      \ containing the CLI syntax description as a string and a list\n        of available\
      \ CLI options.\n\n    Raises\n    ------\n    ValueError\n        If either\
      \ supported_codecs or numeric_interpretations is empty.\n\n    Examples\n  \
      \  --------\n    >>> supported_codecs = ['utf-8', 'ascii']\n    >>> numeric_interpretations\
      \ = ['int8', 'float32']\n    >>> cli_syntax, cli_options = design_cli(supported_codecs,\n\
      \    numeric_interpretations)\n    ('binary_parser --file <path> --codec <codec>\
      \ --interpret <interpretation>',\n    ['--file', '--codec', '--interpret'])\n\
      \n    >>> supported_codecs = ['utf-16', 'latin1']\n    >>> numeric_interpretations\
      \ = ['uint16', 'int32']\n    >>> cli_syntax, cli_options = design_cli(supported_codecs,\n\
      \    numeric_interpretations)\n    ('binary_parser --file <path> --codec <codec>\
      \ --interpret <interpretation>',\n    ['--file', '--codec', '--interpret'])\n\
      \n    \"\"\"\n    return DesigncommandlineinterfaceOutput(\n        cli_syntax=\"\
      \",\n        cli_options=\"\",\n    )"
    name: designcommandlineinterface
    nodes_depended_on:
    - definesupportedcodecs
    - definenumericinterpretations
    nodes_dependent_on: []
    output_structure:
    - description: Command line syntax description
      key: cli_syntax
      type: str
    - description: List of CLI options available
      key: cli_options
      type: str
    prd:
      conceptual_info: This node designs the command line interface (CLI) syntax for
        a binary data parsing tool, incorporating supported codecs and numeric interpretations
        from its parent nodes.
      docstring:
        examples:
        - lines:
          - supported_codecs = ['utf-8', 'ascii']
          - numeric_interpretations = ['int8', 'float32']
          - cli_syntax, cli_options = design_cli(supported_codecs, numeric_interpretations)
          output: ('binary_parser --file <path> --codec <codec> --interpret <interpretation>',
            ['--file', '--codec', '--interpret'])
        - lines:
          - supported_codecs = ['utf-16', 'latin1']
          - numeric_interpretations = ['uint16', 'int32']
          - cli_syntax, cli_options = design_cli(supported_codecs, numeric_interpretations)
          output: ('binary_parser --file <path> --codec <codec> --interpret <interpretation>',
            ['--file', '--codec', '--interpret'])
        parameters:
        - description: List of codec names supported by the CLI tool, provided by
            the 'definesupportedcodecs' node.
          name: supported_codecs
          type: List[str]
        - description: List of numeric interpretations supported by the CLI tool,
            provided by the 'definenumericinterpretations' node.
          name: numeric_interpretations
          type: List[str]
        raises:
        - description: If either supported_codecs or numeric_interpretations is empty.
          type: ValueError
        returns:
          description: A tuple containing the CLI syntax description as a string and
            a list of available CLI options.
          type: Tuple[str, List[str]]
        summary: Designs the CLI syntax for specifying binary data files, codecs,
          and numeric interpretations.
    prompt: Define the command line syntax for users to specify input files, codecs,
      and interpretations
    shims: []
