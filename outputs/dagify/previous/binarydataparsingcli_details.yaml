      \",\n    )"
    name: integratecliwithparsinglogic
    nodes_depended_on:
    - designcommandlineinterface
    - implementcodecapplication
    - implementnumericinterpretation
    nodes_dependent_on: []
    output_structure:
    - description: Description of the fully integrated CLI tool
      key: integrated_cli_tool
