      docstring:
        examples:
        - lines:
          - definenumericinterpretations()
          output: '[''int8'', ''uint8'', ''int16'', ''uint16'', ''float32'']'
        - lines:
          - definenumericinterpretations()
          output: '[''int8'', ''uint8'', ''int16'', ''uint16'', ''float32'', ''float64'']'
        parameters: []
        raises:
        - description: If the list of numeric interpretations is empty or invalid.
          type: ValueError
        returns:
          description: A list of numeric interpretation strings (e.g., int8, uint16,
            float32).
          type: List[str]
        summary: Returns a list of numeric interpretations supported by the CLI tool.
    prompt: List all numeric interpretations (e.g., int8, uint16, float32) that the
