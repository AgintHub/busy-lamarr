dag_type: plain_text
description: Workflow that defines supported codecs and numeric types, designs a CLI,
  documents the tool, implements parsing logic, writes tests, and finalizes a distributable
  package, with each original task split into two concurrent sub‑tasks whose outputs
  are combined before downstream usage.
name: build_binary_data_parser_with_parallel_parts
nodes:
  define_supported_codecs_combined:
    agent: false
    description: Merge the two partial codec lists into a single final list.
    name: define_supported_codecs_combined
    nodes_depended_on:
    - define_supported_codecs_part1
    - define_supported_codecs_part2
    nodes_dependent_on: []
    prompt: Combine the outputs from Part 1 and Part 2 to produce the final list of
      supported codecs. Merge the two JSON arrays, removing any duplicate codec entries.
  define_supported_codecs_part1:
    agent: false
    description: Generate first part of supported codecs list.
    name: define_supported_codecs_part1
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: 'Part 1: Provide a comma‑separated list of codec identifiers that the
      binary parser should handle, including common text encodings such as ASCII,
      ISO‑8859‑1, UTF‑8, UTF‑16 (little endian, big endian), and binary representations
      such as Base64. For each codec, specify its name and a short description of
      its characteristics. Return the list as a JSON array of objects with fields
      "codec" and "description".'
  define_supported_codecs_part2:
    agent: false
    description: Generate second part of supported codecs list.
    name: define_supported_codecs_part2
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: 'Part 2: Provide a comma‑separated list of codec identifiers that the
      binary parser should handle, including common text encodings such as ASCII,
      ISO‑8859‑1, UTF‑8, UTF‑16 (little endian, big endian), and binary representations
      such as Base64. For each codec, specify its name and a short description of
      its characteristics. Return the list as a JSON array of objects with fields
      "codec" and "description".'
  define_supported_numeric_types_combined:
    agent: false
    description: Merge the two partial numeric type lists into a single final list.
    name: define_supported_numeric_types_combined
    nodes_depended_on:
    - define_supported_numeric_types_part1
    - define_supported_numeric_types_part2
    nodes_dependent_on: []
    prompt: Combine the outputs from Part 1 and Part 2 to produce the final list of
      supported numeric types. Merge the two JSON arrays, removing any duplicate type
      entries.
  define_supported_numeric_types_part1:
    agent: false
    description: Generate first part of supported numeric types list.
    name: define_supported_numeric_types_part1
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: 'Part 1: List the numeric data types that the parser must support, covering
      signed and unsigned integers of 8, 16, 32, and 64 bits, as well as single and
      double precision floating point. For each type, include its name (e.g., int8,
      uint16, float32) and specify byte order (little endian, big endian) if applicable.
      Output as a JSON array with fields "type" and "description".'
  define_supported_numeric_types_part2:
    agent: false
    description: Generate second part of supported numeric types list.
    name: define_supported_numeric_types_part2
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: 'Part 2: List the numeric data types that the parser must support, covering
      signed and unsigned integers of 8, 16, 32, and 64 bits, as well as single and
      double precision floating point. For each type, include its name (e.g., int8,
      uint16, float32) and specify byte order (little endian, big endian) if applicable.
      Output as a JSON array with fields "type" and "description".'
  design_command_line_interface_combined:
    agent: false
    description: Merge the two partial CLI designs into a single final specification.
    name: design_command_line_interface_combined
    nodes_depended_on:
    - design_command_line_interface_part1
    - design_command_line_interface_part2
    nodes_dependent_on: []
    prompt: Combine the outputs from Part 1 and Part 2 to produce the final CLI interface
      specification. Merge the two JSON objects, ensuring all arguments are included
      without duplication.
  design_command_line_interface_part1:
    agent: false
    description: Generate first part of CLI interface design.
    name: design_command_line_interface_part1
    nodes_depended_on:
    - define_supported_codecs_combined
    - define_supported_numeric_types_combined
    nodes_dependent_on: []
    prompt: 'Part 1: Design a command‑line interface for the binary parser. Include
      a help flag, an input file argument, optional codec selection (--codec), optional
      numeric type selection (--type), and flags for verbosity and output format.
      Provide a concise description of each argument and its expected values, along
      with short and long forms, default values, and help text. Output the interface
      specification in JSON format with fields for "name", "description", "arguments"
      array of objects with "flag", "short", "long", "default", "help", "required",
      and "type".'
  design_command_line_interface_part2:
    agent: false
    description: Generate second part of CLI interface design.
    name: design_command_line_interface_part2
    nodes_depended_on:
    - define_supported_codecs_combined
    - define_supported_numeric_types_combined
    nodes_dependent_on: []
    prompt: 'Part 2: Design a command‑line interface for the binary parser. Include
      a help flag, an input file argument, optional codec selection (--codec), optional
      numeric type selection (--type), and flags for verbosity and output format.
      Provide a concise description of each argument and its expected values, along
      with short and long forms, default values, and help text. Output the interface
      specification in JSON format with fields for "name", "description", "arguments"
      array of objects with "flag", "short", "long", "default", "help", "required",
      and "type".'
  document_command_line_tool_combined:
    agent: false
    description: Merge the two partial documentation sections into a single final
      document.
    name: document_command_line_tool_combined
    nodes_depended_on:
    - document_command_line_tool_part1
    - document_command_line_tool_part2
    nodes_dependent_on: []
    prompt: Combine the outputs from Part 1 and Part 2 to produce the final documentation.
      Merge the two text sections, removing any duplicate sentences.
  document_command_line_tool_part1:
    agent: false
    description: Generate first part of CLI documentation.
    name: document_command_line_tool_part1
    nodes_depended_on:
    - design_command_line_interface_combined
    nodes_dependent_on: []
    prompt: 'Part 1: Write thorough documentation for the CLI tool. Include usage
      examples with real command lines, a description of each option, and notes on
      supported codecs and numeric types. Also provide troubleshooting guidance for
      common errors. Return the documentation as plain text.'
  document_command_line_tool_part2:
    agent: false
    description: Generate second part of CLI documentation.
    name: document_command_line_tool_part2
    nodes_depended_on:
    - design_command_line_interface_combined
    nodes_dependent_on: []
    prompt: 'Part 2: Write thorough documentation for the CLI tool. Include usage
      examples with real command lines, a description of each option, and notes on
      supported codecs and numeric types. Also provide troubleshooting guidance for
      common errors. Return the documentation as plain text.'
  finalize_binary_data_parser_combined:
    agent: false
    description: Merge the two partial package archives into a single final archive.
    name: finalize_binary_data_parser_combined
    nodes_depended_on:
    - finalize_binary_data_parser_part1
    - finalize_binary_data_parser_part2
    nodes_dependent_on: []
    prompt: Combine the outputs from Part 1 and Part 2 to produce the final distributable
      package. Merge the two JSON archive listings, ensuring each file is included
      only once.
  finalize_binary_data_parser_part1:
    agent: false
    description: Generate first part of final package archive.
    name: finalize_binary_data_parser_part1
    nodes_depended_on:
    - integrate_parsing_logic_combined
    - write_test_cases_combined
    - document_command_line_tool_combined
    nodes_dependent_on: []
    prompt: 'Part 1: Merge the integrated parser script, test cases, and documentation
      into a final package. Provide a README with installation instructions, usage
      guide, and test execution steps. Output the complete archive contents as a JSON
      with file paths and contents. Ensure all dependencies are listed and that the
      package can be built and tested by running `python -m unittest`.'
  finalize_binary_data_parser_part2:
    agent: false
    description: Generate second part of final package archive.
    name: finalize_binary_data_parser_part2
    nodes_depended_on:
    - integrate_parsing_logic_combined
    - write_test_cases_combined
    - document_command_line_tool_combined
    nodes_dependent_on: []
    prompt: 'Part 2: Merge the integrated parser script, test cases, and documentation
      into a final package. Provide a README with installation instructions, usage
      guide, and test execution steps. Output the complete archive contents as a JSON
      with file paths and contents. Ensure all dependencies are listed and that the
      package can be built and tested by running `python -m unittest`.'
  implement_codec_parsing_logic_combined:
    agent: false
    description: Merge the two partial codec parsing implementations into a single
      final implementation.
    name: implement_codec_parsing_logic_combined
    nodes_depended_on:
    - implement_codec_parsing_logic_part1
    - implement_codec_parsing_logic_part2
    nodes_dependent_on: []
    prompt: Combine the outputs from Part 1 and Part 2 to produce the final codec
      parsing implementation. Merge the two sets of code snippets, resolving any duplicate
      function definitions.
  implement_codec_parsing_logic_part1:
    agent: false
    description: Generate first part of codec parsing implementation.
    name: implement_codec_parsing_logic_part1
    nodes_depended_on:
    - define_supported_codecs_combined
    nodes_dependent_on: []
    prompt: 'Part 1: Implement the code that decodes binary input into the specified
      codecs. For each codec from the definition step, provide a function that takes
      a byte array and returns the decoded string or appropriate data structure, handling
      errors and reporting decoding failures. Return the complete implementation as
      Python code snippets, including necessary imports.'
  implement_codec_parsing_logic_part2:
    agent: false
    description: Generate second part of codec parsing implementation.
    name: implement_codec_parsing_logic_part2
    nodes_depended_on:
    - define_supported_codecs_combined
    nodes_dependent_on: []
    prompt: 'Part 2: Implement the code that decodes binary input into the specified
      codecs. For each codec from the definition step, provide a function that takes
      a byte array and returns the decoded string or appropriate data structure, handling
      errors and reporting decoding failures. Return the complete implementation as
      Python code snippets, including necessary imports.'
  implement_numeric_parsing_logic_combined:
    agent: false
    description: Merge the two partial numeric parsing implementations into a single
      final implementation.
    name: implement_numeric_parsing_logic_combined
    nodes_depended_on:
    - implement_numeric_parsing_logic_part1
    - implement_numeric_parsing_logic_part2
    nodes_dependent_on: []
    prompt: Combine the outputs from Part 1 and Part 2 to produce the final numeric
      parsing implementation. Merge the two sets of code snippets, resolving any duplicate
      function definitions.
  implement_numeric_parsing_logic_part1:
    agent: false
    description: Generate first part of numeric parsing implementation.
    name: implement_numeric_parsing_logic_part1
    nodes_depended_on:
    - define_supported_numeric_types_combined
    nodes_dependent_on: []
    prompt: 'Part 1: Implement code to parse numeric values from binary data for each
      numeric type defined earlier. Provide functions that read a sequence of bytes
      and return the numeric value, handling endianness. Output the implementation
      as Python code snippets with imports.'
  implement_numeric_parsing_logic_part2:
    agent: false
    description: Generate second part of numeric parsing implementation.
    name: implement_numeric_parsing_logic_part2
    nodes_depended_on:
    - define_supported_numeric_types_combined
    nodes_dependent_on: []
    prompt: 'Part 2: Implement code to parse numeric values from binary data for each
      numeric type defined earlier. Provide functions that read a sequence of bytes
      and return the numeric value, handling endianness. Output the implementation
      as Python code snippets with imports.'
  integrate_parsing_logic_combined:
    agent: false
    description: Merge the two partial integrated parsing scripts into a single final
      script.
    name: integrate_parsing_logic_combined
    nodes_depended_on:
    - integrate_parsing_logic_part1
    - integrate_parsing_logic_part2
    nodes_dependent_on: []
    prompt: Combine the outputs from Part 1 and Part 2 to produce the final integrated
      parsing logic. Merge the two Python scripts, ensuring all functions and argument
      parsing are included once.
  integrate_parsing_logic_part1:
    agent: false
    description: Generate first part of integrated parsing logic.
    name: integrate_parsing_logic_part1
    nodes_depended_on:
    - implement_codec_parsing_logic_combined
    - implement_numeric_parsing_logic_combined
    - design_command_line_interface_combined
    nodes_dependent_on: []
    prompt: 'Part 1: Combine the codec and numeric parsing functions into a single
      CLI program that accepts an input file, codec, and numeric type arguments. Show
      how the selected codec and numeric type are applied to read and interpret the
      binary file, and how results are displayed to the user. Provide a full Python
      script with argument parsing, calling parsing functions, and formatting output.
      Include comments.'
  integrate_parsing_logic_part2:
    agent: false
    description: Generate second part of integrated parsing logic.
    name: integrate_parsing_logic_part2
    nodes_depended_on:
    - implement_codec_parsing_logic_combined
    - implement_numeric_parsing_logic_combined
    - design_command_line_interface_combined
    nodes_dependent_on: []
    prompt: 'Part 2: Combine the codec and numeric parsing functions into a single
      CLI program that accepts an input file, codec, and numeric type arguments. Show
      how the selected codec and numeric type are applied to read and interpret the
      binary file, and how results are displayed to the user. Provide a full Python
      script with argument parsing, calling parsing functions, and formatting output.
      Include comments.'
  write_test_cases_combined:
    agent: false
    description: Merge the two partial test case lists into a single final list.
    name: write_test_cases_combined
    nodes_depended_on:
    - write_test_cases_part1
    - write_test_cases_part2
    nodes_dependent_on: []
    prompt: Combine the outputs from Part 1 and Part 2 to produce the final set of
      test cases. Merge the two JSON arrays, removing duplicate test definitions.
  write_test_cases_part1:
    agent: false
    description: Generate first part of test cases.
    name: write_test_cases_part1
    nodes_depended_on:
    - integrate_parsing_logic_combined
    nodes_dependent_on: []
    prompt: 'Part 1: Write comprehensive test cases covering all codecs and numeric
      types. For each case, specify test name, input bytes (hex), expected decoded
      output, and expected error handling. Provide these in a JSON array with ''test_name'',
      ''input_bytes'', ''expected_output'', and ''expected_error''.'
  write_test_cases_part2:
    agent: false
    description: Generate second part of test cases.
    name: write_test_cases_part2
    nodes_depended_on:
    - integrate_parsing_logic_combined
    nodes_dependent_on: []
    prompt: 'Part 2: Write comprehensive test cases covering all codecs and numeric
      types. For each case, specify test name, input bytes (hex), expected decoded
      output, and expected error handling. Provide these in a JSON array with ''test_name'',
      ''input_bytes'', ''expected_output'', and ''expected_error''.'
