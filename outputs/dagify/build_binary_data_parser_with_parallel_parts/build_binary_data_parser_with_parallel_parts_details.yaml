      key: numeric_type_used
      type: str
    prompt: "Write a comprehensive Python script that:\n\n1. **Imports and wiring**\
      \ – Import `Path` from `pathlib`, `argparse`, `logging`, and the merged parsing\
      \ functions (`parse_with_codec` and `parse_numeric_data`) produced in the *implement_*\
      \ nodes. Import the CLI specification JSON produced by `design_command_line_interface_combined`\
      \ and use it to dynamically build the argument parser.\n2. **Argument parsing**\
      \ – Use `argparse.ArgumentParser` to create a well‑documented CLI that accepts:\n\
      \   * `--input` (required): path to the binary file.\n   * `--codec` (required):\
      \ codec name (e.g., `utf‑8`, `utf‑16le`).\n   * `--numeric` (required): numeric\
      \ type (`int`, `float`, `double`).\n   * Optional flags such as `--verbose`,\
      \ `--output-format` (choices: `text`, `json`).\n   * Provide helpful help messages,\
      \ default values, and type checks.\n3. **Validation & error handling** – Verify\
      \ that the input file exists and is readable. Validate codec and numeric arguments\
      \ against known lists. Log detailed error messages and exit gracefully on failure.\n\
      4. **File reading** – Open the file in binary mode using `Path.read_bytes()`\
      \ or a buffered stream. Optionally, support large files by streaming chunks.\n\
      5. **Parsing logic** – First call `parse_with_codec(input_bytes, codec)` to\
      \ obtain a decoded string. Then call `parse_numeric_data(decoded_str, numeric_type)`\
      \ to interpret the payload as the selected numeric type. Show how both functions\
      \ are composed.\n6. **Output formatting** – If `--output-format text`, display\
      \ a neatly aligned table (use `tabulate` or manual formatting) with column headings\
      \ `Index`, `Value`. If `json`, emit a JSON array of values with a top‑level\
      \ key.\n7. **Logging & verbosity** – If `--verbose` is set, use the `logging`\
      \ module to emit debug information about each step (e.g., file size, codec used,\
      \ number of values parsed).\n8. **Entry point** – Wrap the main logic in a `main()`\
      \ function and protect it with `if __name__ == \"__main__\": main()`.\n9. **Docstrings\
      \ & comments** – Include a module‑level docstring explaining purpose, usage,\
      \ and dependencies, and inline comments to clarify non‑obvious logic.\n10. **Testing\
      \ hook** – Optionally expose the core parsing orchestration as a separate function\
      \ (`process_file`) that can be unit‑tested.\n\nProvide the full source code\
      \ with proper type annotations, error handling, and comments that make the script\
      \ immediately runnable in a standard Python 3.11+ environment. The code should\
      \ be ready for inclusion in a larger codebase or for distribution as a standalone\
      \ utility. Ensure that the script imports only standard libraries and the modules\
      \ generated by the *implement_* nodes.\n\n**Example skeleton to guide your implementation:**\n\
      \n```python\n#!/usr/bin/env python3\n\"\"\"\nBinary Parser CLI – Combines codec\
      \ and numeric parsing.\n\nDependencies:\n* parse_with_codec(input_bytes: bytes,\
      \ codec: str) -> str\n* parse_numeric_data(decoded: str, numeric_type: str)\
      \ -> List[Union[int, float]]\n\nUsage:\n    python parse_cli.py --input data.bin\
      \ --codec utf-8 --numeric float\n\n\"\"\"\n\nfrom __future__ import annotations\n\
      \nimport argparse\nimport json\nimport logging\nimport sys\nfrom pathlib import\
      \ Path\nfrom typing import List, Union\n\n# Assume these functions are provided\
      \ by previous nodes\nfrom codec_parsing import parse_with_codec\nfrom numeric_parsing\
      \ import parse_numeric_data\n\n# Build argument parser based on the JSON spec\
      \ from design_command_line_interface_combined\n\ndef build_parser() -> argparse.ArgumentParser:\n\
      \    parser = argparse.ArgumentParser(\n        prog=\"parse_cli\",\n      \
      \  description=\"Decode a binary file using a specified codec and numeric type.\"\
      ,\n    )\n    parser.add_argument(\"--input\", required=True, type=Path, help=\"\
      Path to the binary file.\")\n    parser.add_argument(\"--codec\", required=True,\
      \ choices=[\"utf-8\", \"utf-16le\", \"base64\"], help=\"Codec to apply to the\
      \ raw bytes.\")\n    parser.add_argument(\"--numeric\", required=True, choices=[\"\
      int\", \"float\", \"double\"], help=\"Numeric interpretation of the decoded\
      \ payload.\")\n    parser.add_argument(\"--output-format\", default=\"text\"\
      , choices=[\"text\", \"json\"], help=\"Format of the parsed output.\")\n   \
      \ parser.add_argument(\"--verbose\", action=\"store_true\", help=\"Enable verbose\
      \ logging.\")\n    return parser\n\n\n# Core orchestration function – unit‑testable\n\
      \ndef process_file(input_path: Path, codec: str, numeric: str, output_format:\
      \ str) -> Union[str, List[Union[int, float]]]:\n    logging.debug(\"Reading\
      \ file %s\", input_path)\n    raw_bytes = input_path.read_bytes()\n    logging.debug(\"\
      Read %d bytes\", len(raw_bytes))\n\n    logging.debug(\"Applying codec: %s\"\
      , codec)\n    decoded = parse_with_codec(raw_bytes, codec)\n    logging.debug(\"\
      Decoded string length: %d\", len(decoded))\n\n    logging.debug(\"Parsing numeric\
      \ data as %s\", numeric)\n    values = parse_numeric_data(decoded, numeric)\n\
      \    logging.debug(\"Parsed %d numeric values\", len(values))\n\n    if output_format\
      \ == \"json\":\n        return values\n    # default text format\n    table\
      \ = \"Index\\tValue\\n\" + \"\\n\".join(f\"{i}\\t{v}\" for i, v in enumerate(values))\n\
      \    return table\n\n\ndef main() -> None:\n    parser = build_parser()\n  \
      \  args = parser.parse_args()\n\n    if args.verbose:\n        logging.basicConfig(level=logging.DEBUG,\
      \ format=\"[%(levelname)s] %(message)s\")\n    else:\n        logging.basicConfig(level=logging.INFO,\
      \ format=\"[%(levelname)s] %(message)s\")\n\n    if not args.input.is_file():\n\
      \        logging.error(\"Input file not found: %s\", args.input)\n        sys.exit(1)\n\
      \n    result = process_file(args.input, args.codec, args.numeric, args.output_format)\n\
      \n    if args.output_format == \"json\":\n        print(json.dumps({\"values\"\
      : result}, indent=2))\n    else:\n        print(result)\n\n\nif __name__ ==\
      \ \"__main__\":\n    main()\n```"
