dag_type: typed
description: Generated workflow from UI.
name: build_binary_data_parser_with_parallel_parts
nodes:
  define_supported_codecs_combined:
    agent: false
    description: Consolidates two partial codec lists into a single, de‑duplicated,
      alphabetically sorted array. The node guarantees that each codec identifier
      appears only once, preserves the descriptive metadata, and produces a canonical
      JSON payload suitable for downstream parsing modules.
    name: define_supported_codecs_combined
    nodes_depended_on:
    - define_supported_codecs_part1
    - define_supported_codecs_part2
    nodes_dependent_on: []
    output_structure:
    - description: Alphabetically sorted list of unique codec identifiers.
      key: canonical_codec_identifiers
      type: List[str]
    - description: List of concise descriptions corresponding to each codec in the
        canonical_codec_identifiers list.
      key: canonical_codec_descriptions
      type: List[str]
    - description: Error message if validation of the input JSON fails, or an empty
        string if no errors.
      key: validation_errors
      type: str
    prompt: 'Merge the two JSON arrays emitted by *define_supported_codecs_part1*
      and *define_supported_codecs_part2* into a single, canonical list of codecs.
      Each array element is an object with the fields `codec` (string) and `description`
      (string). Perform the following:

      1. Concatenate the arrays.

      2. Remove duplicate codec entries—duplicates are identified by identical `codec`
      values; keep the first occurrence.

      3. Sort the resulting array alphabetically by the `codec` identifier.

      4. Return the sorted array as a well‑formed JSON array of objects, exactly matching
      the input schema.

      5. Validate that every `codec` string is non‑empty and that each `description`
      is a concise one‑line summary.

      6. If any input contains malformed JSON or missing required fields, raise an
      informative error.


      The final output will serve as the authoritative registry for the binary parser’s
      supported codecs.'
  define_supported_codecs_part1:
    agent: false
    description: Generate a structured, technically detailed enumeration of the first
      half of the binary parser’s supported codec identifiers.  This includes common
      text encodings (ASCII, ISO‑8859‑1, Windows‑1252, UTF‑8, UTF‑16 variants, UTF‑32
      variants, UTF‑7) and a binary representation (Base64).  Each entry must provide
      the codec’s canonical name and a short, specification‑driven description covering
      reference standards, byte patterns or BOMs, typical file extensions or MIME
      types, and any special parsing notes.  The output is a JSON array of objects
      with fields `codec` and `description`, ready for downstream consumption.
    name: define_supported_codecs_part1
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: Ordered list of codec identifiers as specified in the output array.
      key: codecs
      type: List[str]
    - description: Ordered list of textual descriptions corresponding to each codec;
        the nth entry aligns with the nth codec.
      key: descriptions
      type: List[str]
    prompt: "Part 1: Generate the first segment of the supported codecs list for the\
      \ binary parser.  Include the following encodings:\n\n* **ASCII** – 7‑bit, no\
      \ BOM, .txt\n* **ISO‑8859‑1** – 8‑bit, no BOM, .txt, .html\n* **Windows‑1252**\
      \ – 8‑bit, no BOM, .txt, .html\n* **UTF‑8** – variable‑length, optional BOM,\
      \ .txt, .json, RFC 3629\n* **UTF‑16LE** – 16‑bit, mandatory BOM `0xFF 0xFE`,\
      \ .txt, .xml\n* **UTF‑16BE** – 16‑bit, mandatory BOM `0xFE 0xFF`, .txt, .xml\n\
      * **UTF‑32LE** – 32‑bit, mandatory BOM `0xFF 0xFE 0x00 0x00`, .txt\n* **UTF‑32BE**\
      \ – 32‑bit, mandatory BOM `0x00 0x00 0xFE 0xFF`, .txt\n* **UTF‑7** – 7‑bit,\
      \ optional BOM, legacy .msg files\n* **Base64** – binary‑to‑text, no BOM, MIME\
      \ type `application/base64`\n\nFor each codec, produce an object with the fields:\n\
      - `codec`: the canonical identifier string (e.g., `UTF-8`).\n- `description`:\
      \ a concise technical summary that includes:\n  - Reference standard (RFC or\
      \ ISO number).\n  - Typical byte‑range or BOM presence.\n  - Common file extensions\
      \ or MIME type.\n  - Parsing nuances (e.g., endianess, padding, variable‑length).\n\
      \nReturn the data as a JSON array of these objects **only**—no additional text,\
      \ comments, or formatting.  This list represents the first half of the full\
      \ codec catalogue; subsequent nodes will supply the remainder.\n\nEnsure the\
      \ JSON is syntactically correct and ready for consumption by downstream parsing\
      \ logic."
  define_supported_codecs_part2:
    agent: false
    description: Generate the second segment of the binary parser’s codec catalog,
      detailing additional text and binary encodings. Provide a JSON array of codec
      objects—each with a unique identifier, a concise yet technically rich description
      (covering BOM handling, endianness, common use‑cases), and any relevant MIME
      or flag metadata. The output must be alphabetically sorted and syntactically
      valid so it can be seamlessly merged with the first segment by downstream nodes.
    name: define_supported_codecs_part2
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: JSON array of codec objects as defined by this node. Each object
        includes fields `codec`, `description`, and optionally `mime` and `bom`.
      key: codec_catalog_json
      type: str
    prompt: "You are tasked with completing the second segment of the binary parser’s\
      \ codec registry.\n\n1. Enumerate **additional text and binary encodings** that\
      \ the parser must support, building on the first part of the list. Include at\
      \ least:\n   - Text encodings: ASCII, ISO‑8859‑1, UTF‑8, UTF‑16LE, UTF‑16BE,\
      \ UTF‑32LE, UTF‑32BE, Shift‑JIS, GB2312, and ISO‑2022‑JP.\n   - Binary representations:\
      \ Base64, Base32, Base16 (hex), and URL‑safe Base64.\n2. For **each codec**\
      \ provide:\n   - `codec`: a unique identifier string (e.g., \"utf-8\", \"base64\"\
      ).\n   - `description`: a concise paragraph (max 30 words) covering the codec’s\
      \ core characteristics (e.g., support for BOM, typical usage, endianness handling,\
      \ and any special parsing caveats).\n   - Optionally include `mime` and `bom`\
      \ flags as extra JSON fields if relevant.\n3. The output must be a **syntactically\
      \ correct JSON array** of objects, sorted alphabetically by the `codec` field.\n\
      4. The array should be ready for ingestion by downstream nodes that merge this\
      \ segment with part 1 to form the complete codec catalog.\n5. No extraneous\
      \ text or commentary—only the JSON array."
  define_supported_numeric_types_combined:
    agent: false
    description: Combines the two partial numeric type specifications generated by
      the parent nodes into a single, canonical list. The node merges the JSON arrays,
      deduplicates by the "type" field, validates required fields, sorts the entries
      alphabetically, and emits a clean JSON array of type‑description objects that
      defines the complete set of numeric data types the parser must handle.
    name: define_supported_numeric_types_combined
    nodes_depended_on:
    - define_supported_numeric_types_part1
    - define_supported_numeric_types_part2
    nodes_dependent_on: []
    output_structure:
    - description: List of numeric type identifiers in canonical alphabetical order
      key: type_names
      type: List[str]
    - description: Corresponding list of descriptions for each numeric type, aligned
        with type_names
      key: type_descriptions
      type: List[str]
    prompt: "Merge the two JSON arrays supplied by the parent nodes \"define_supported_numeric_types_part1\"\
      \ and \"define_supported_numeric_types_part2\". Remove any duplicate entries\
      \ by matching the exact string value of the \"type\" field. Validate that each\
      \ object contains both a \"type\" and a \"description\" field of type string.\
      \ After deduplication, sort the resulting array alphabetically by the \"type\"\
      \ field. Output only the final JSON array of objects; no additional text. Example\
      \ output:\n\n```json\n[\n  {\"type\": \"int16\", \"description\": \"Signed 16‑bit\
      \ integer, little endian\"},\n  {\"type\": \"uint8\", \"description\": \"Unsigned\
      \ 8‑bit integer, little endian\"}\n]\n```\n\nThis array will serve as the definitive\
      \ list of numeric data types the parser must support."
  define_supported_numeric_types_part1:
    agent: false
    description: Enumerates the primitive scalar types that the parser must recognize
      in its first pass. The catalog includes signed and unsigned 8, 16, 32, and 64‑bit
      integers, as well as IEEE 754 single and double‑precision floating‑point values.
      For each type the node produces a concise technical descriptor, the canonical
      type name, and the required byte order (where meaningful). The resulting JSON
      array is designed for seamless consumption by downstream validation and type‑checking
      modules.
    name: define_supported_numeric_types_part1
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: Canonical name of the numeric type, e.g., int8
      key: type_name
      type: str
    - description: Technical description covering sign convention, encoding, and typical
        use case.
      key: description
      type: str
    - description: Endianness for the type; empty string if the type is endianness‑agnostic.
      key: byte_order
      type: str
    - description: Floating‑point precision ('single' or 'double'); empty string for
        non‑floating types.
      key: precision
      type: str
    prompt: 'Generate Part 1 of the parser’s supported numeric type catalog. For each
      scalar type, provide:


      - **type**: canonical name (e.g., int8, uint16, float32, float64).

      - **description**: a concise technical note covering sign convention, encoding
      (two’s‑complement for integers, IEEE 754 for floating point), and typical use
      case.

      - **byte_order**: "little" or "big" endianness when applicable; omit for types
      where endianness is irrelevant.

      - **precision** (optional, only for floating‑point types): "single" for float32,
      "double" for float64.


      The output must be a valid JSON array of objects, each with the keys above.
      This JSON should be immediately ingestible by downstream validation modules.'
  define_supported_numeric_types_part2:
    agent: false
    description: Produces the second segment of the parser’s numeric type specification.
      This node lists the remaining signed and unsigned integer types (8, 16, 32, 64 bits)
      and floating‑point types (single and double precision), explicitly indicating
      signedness, bit width, and byte order. The output is a JSON array of objects
      suitable for direct ingestion into the parser’s configuration schema.
    name: define_supported_numeric_types_part2
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: The numeric type identifier (e.g., "int16", "uint32", "float64").
      key: type
      type: str
    - description: A human‑readable description indicating signedness, bit width,
        and endian-ness.
      key: description
      type: str
    prompt: "Generate Part 2 of the numeric type catalog for the parser. Enumerate\
      \ the numeric data types that remain to be specified, namely:\n\n1. Signed integers:\
      \ int8, int16, int32, int64\n2. Unsigned integers: uint8, uint16, uint32, uint64\n\
      3. Floating‑point: float32 (single precision), float64 (double precision)\n\n\
      For each type, produce a JSON object with the following fields:\n- **type**\
      \ – a string such as \"int16\", \"uint32\", \"float64\"\n- **description** –\
      \ a concise sentence that specifies the signedness (if applicable), the bit\
      \ width, and the byte order. For example, \"signed 32‑bit little endian integer\"\
      \ or \"unsigned 64‑bit big endian integer\". If the type is endianness‑agnostic\
      \ (e.g., floating‑point in a fixed‑byte order environment), include the appropriate\
      \ endianness in the description.\n\nIf a type can be represented in both little\
      \ and big endian forms, emit two separate objects, one for each endianness.\n\
      \nThe final output must be a well‑formed JSON array containing all such objects.\
      \ This array will be consumed directly by the parser configuration generator.\n\
      \n**Example output snippet**:\n```json\n[{\n  \"type\": \"int16\",\n  \"description\"\
      : \"signed 16‑bit little endian integer\"\n},{\n  \"type\": \"int16\",\n  \"\
      description\": \"signed 16‑bit big endian integer\"\n}, …]\n```"
  design_command_line_interface_combined:
    agent: false
    description: Consolidates two partially‑designed command‑line interface specifications
      into a single, validated JSON schema, resolving argument duplications, normalizing
      flag definitions, and ensuring type correctness for a robust binary parser CLI.
    name: design_command_line_interface_combined
    nodes_depended_on:
    - design_command_line_interface_part1
    - design_command_line_interface_part2
    nodes_dependent_on: []
    output_structure:
    - description: The fully merged command‑line interface specification in JSON format.
      key: final_spec
      type: str
    - description: A list of validation error messages; empty if no errors.
      key: errors
      type: List[str]
    - description: A list of human‑readable descriptions of any overridden arguments.
      key: conflicts
      type: List[str]
    prompt: "Merge the JSON specifications generated by `design_command_line_interface_part1`\
      \ and `design_command_line_interface_part2` into a single, fully‑consolidated\
      \ CLI description:\n\n1. **Core Metadata** – Ensure the `name` and `description`\
      \ fields are identical in both parts; if they differ, select the value from\
      \ Part 2 and record a note in the output.\n2. **Argument Consolidation** – Concatenate\
      \ the two `arguments` arrays, then deduplicate entries by their `flag` (or `long`\
      \ if `flag` is absent). When an argument appears in both parts, prefer the Part 2\
      \ definition, but include a `conflict_resolution` object noting the original\
      \ values.\n3. **Type & Default Validation** – For each argument, verify that\
      \ the `default` value conforms to the declared `type` (`string`, `integer`,\
      \ `boolean`, `list`). If a mismatch is detected, flag an error and provide a\
      \ suggested correction.\n4. **Required Flag Enforcement** – All arguments marked\
      \ `required: true` in either part must appear in the final list; missing required\
      \ arguments must trigger an error.\n5. **JSON Schema Compliance** – Output the\
      \ final specification as pretty‑printed JSON that conforms to the following\
      \ schema:\n   ```json\n   {\n     \"name\": \"string\",\n     \"description\"\
      : \"string\",\n     \"arguments\": [\n       {\n         \"flag\": \"string\"\
      ,\n         \"short\": \"string\",\n         \"long\": \"string\",\n       \
      \  \"default\": <any>,\n         \"help\": \"string\",\n         \"required\"\
      : \"boolean\",\n         \"type\": \"string\"\n       }\n     ]\n   }\n   ```\n\
      6. **Conflict Log** – Append a `conflicts` array summarizing any overridden\
      \ arguments, listing the original and final values.\n\nReturn the complete specification\
      \ in JSON. If any validation errors arise, output an `errors` array describing\
      \ the issue(s) and abort the merge.\n"
  design_command_line_interface_part1:
    agent: false
    description: Produces the first‑stage blueprint for the binary parser’s command‑line
      interface. This blueprint must be serializable in JSON, detailing each flag’s
      short and long forms, type, requirement status, default value, and help text.
      The design references the combined codec and numeric type enumerations generated
      by the dependencies `define_supported_codecs_combined` and `define_supported_numeric_types_combined`,
      ensuring that validation lists are up‑to‑date and free of duplicates.
    name: design_command_line_interface_part1
    nodes_depended_on:
    - define_supported_codecs_combined
    - define_supported_numeric_types_combined
    nodes_dependent_on: []
    output_structure:
    - description: Complete JSON specification of the command‑line interface, including
        name, description, and argument definitions.
      key: cli_spec
      type: str
    prompt: 'Craft a concise yet comprehensive JSON specification for a command‑line
      interface tailored to a binary parser binary. The specification should include:


      1. **Help flag**: `-h`, `--help` – displays usage and exits.

      2. **Input file argument**: `-i <file>`, `--input <file>` – mandatory, type
      `string`, required.

      3. **Codec selector**: `-c <codec>`, `--codec <codec>` – optional, type `string`,
      allowed values populated from `define_supported_codecs_combined`. Default to
      the first codec in that list.

      4. **Numeric type selector**: `-t <type>`, `--type <type>` – optional, type
      `string`, allowed values populated from `define_supported_numeric_types_combined`.
      Default to the first type in that list.

      5. **Verbosity flag**: `-v`, `--verbose` – optional boolean toggle.

      6. **Output format flag**: `-o <fmt>`, `--output-format <fmt>` – optional, type
      `string`, allowed values `{"json", "text", "csv"}` with a default of `json`.


      Each argument object must contain the following fields: `flag`, `short`, `long`,
      `default`, `help`, `required`, `type`. The final JSON should be an object with
      keys `name`, `description`, and an array `arguments` of these objects. Ensure
      that all strings are quoted, arrays are properly closed, and the JSON is valid
      per RFC‑8259.


      Output the complete JSON specification without any surrounding commentary.'
  design_command_line_interface_part2:
    agent: false
    description: Specifies the second stage of a robust CLI for the binary parser,
      detailing all flags, arguments, defaults, and help text in a machine‑readable
      JSON format. The design incorporates dynamic codec and numeric type choices
      from upstream nodes, enabling extensible and type‑safe parsing configurations.
    name: design_command_line_interface_part2
    nodes_depended_on:
    - define_supported_codecs_combined
    - define_supported_numeric_types_combined
    nodes_dependent_on: []
    output_structure:
    - description: CLI tool name
      key: name
      type: str
    - description: CLI tool description
      key: description
      type: str
    - description: JSON string representing the list of arguments
      key: arguments_json
      type: str
    prompt: "Generate the second part of the command‑line interface (CLI) design for\
      \ the binary parser binary. The specification must:\n\n1. **Include** a comprehensive\
      \ help flag (`-h`/`--help`) that displays usage, argument descriptions, and\
      \ defaults.\n2. **Define** a required positional argument for the input file\
      \ (`input_file`), accepting a path to a binary data file.\n3. **Provide** an\
      \ optional codec selector (`-c`/`--codec`) whose admissible values are the union\
      \ of the two codec lists supplied by the dependencies `define_supported_codecs_combined`\
      \ and `define_supported_numeric_types_combined`.\n4. **Allow** an optional numeric\
      \ type selector (`-t`/`--type`) with choices from the combined numeric types\
      \ list.\n5. **Add** a verbosity flag (`-v`/`--verbose`) that toggles progressive\
      \ console output (boolean, default `false`).\n6. **Implement** an output format\
      \ flag (`-o`/`--output-format`) accepting either `json` or `yaml`, defaulting\
      \ to `json`.\n7. **Describe** each argument concisely with its short form, long\
      \ form, requiredness, default value, type, and help text.\n8. **Output** the\
      \ complete CLI definition as a JSON object containing the following structure:\n\
      \   ```json\n   {\n     \"name\": \"binary_parser_cli\",\n     \"description\"\
      : \"A lightweight CLI for the binary parser binary.\",\n     \"arguments\":\
      \ [\n       {\n         \"flag\": \"-h, --help\",\n         \"short\": \"-h\"\
      ,\n         \"long\": \"--help\",\n         \"required\": false,\n         \"\
      default\": null,\n         \"type\": \"boolean\",\n         \"help\": \"Display\
      \ help information and exit.\"\n       },\n       {\n         \"flag\": \"input_file\"\
      ,\n         \"short\": null,\n         \"long\": null,\n         \"required\"\
      : true,\n         \"default\": null,\n         \"type\": \"string\",\n     \
      \    \"help\": \"Path to the binary file to parse.\"\n       },\n       {\n\
      \         \"flag\": \"-c, --codec\",\n         \"short\": \"-c\",\n        \
      \ \"long\": \"--codec\",\n         \"required\": false,\n         \"default\"\
      : \"auto\",\n         \"type\": \"enum\",\n         \"help\": \"Select codec\
      \ to decode; choices: <comma-separated list of combined codecs>.\"\n       },\n\
      \       {\n         \"flag\": \"-t, --type\",\n         \"short\": \"-t\",\n\
      \         \"long\": \"--type\",\n         \"required\": false,\n         \"\
      default\": \"auto\",\n         \"type\": \"enum\",\n         \"help\": \"Specify\
      \ numeric type for parsed values; choices: <comma-separated list of combined\
      \ numeric types>.\"\n       },\n       {\n         \"flag\": \"-v, --verbose\"\
      ,\n         \"short\": \"-v\",\n         \"long\": \"--verbose\",\n        \
      \ \"required\": false,\n         \"default\": false,\n         \"type\": \"\
      boolean\",\n         \"help\": \"Increase verbosity of runtime logs.\"\n   \
      \    },\n       {\n         \"flag\": \"-o, --output-format\",\n         \"\
      short\": \"-o\",\n         \"long\": \"--output-format\",\n         \"required\"\
      : false,\n         \"default\": \"json\",\n         \"type\": \"enum\",\n  \
      \       \"help\": \"Output format for parsed data; either json or yaml.\"\n\
      \       }\n     ]\n   }\n   ```\n   Replace `<comma-separated list of combined\
      \ codecs>` and `<comma-separated list of combined numeric types>` with the actual\
      \ values produced by the dependent nodes.\n\nEnsure the JSON output is valid,\
      \ well‑formatted, and can be parsed directly by downstream tooling."
  document_command_line_tool_combined:
    agent: false
    description: Performs a comprehensive synthesis of the two independently generated
      CLI documentation fragments into a unified, authoritative reference guide. The
      node ensures consistency, eliminates redundancy, resolves conflicting option
      descriptions, and enriches the output with a structured table of contents, metadata
      headers, and standardized formatting, producing a clean Markdown document ready
      for release.
    name: document_command_line_tool_combined
    nodes_depended_on:
    - document_command_line_tool_part1
    - document_command_line_tool_part2
    nodes_dependent_on: []
    output_structure:
    - description: The complete Markdown document with consolidated CLI documentation,
        including metadata, table of contents, usage examples, options, and troubleshooting
        sections.
      key: markdown_content
      type: str
    - description: List of metadata headers included in the documentation, such as
        version, build date, author, and license.
      key: metadata_headers
      type: List[str]
    - description: List of section titles corresponding to the table of contents included
        in the documentation.
      key: section_titles
      type: List[str]
    - description: List of resolved conflicts between Part 1 and Part 2, detailing
        which part's content was selected or merged.
      key: conflict_resolutions
      type: List[str]
    prompt: 'Merge the outputs from Part 1 and Part 2 into a single, cohesive CLI
      documentation file.


      **Processing steps**:

      1. Parse each section and identify duplicate sentences or overlapping option
      descriptions.

      2. Resolve conflicts by selecting the most recent or the most comprehensive
      version of each option.

      3. Generate a consolidated table of contents that lists all commands, options,
      and sections.

      4. Re‑format code fences, bullet lists, tables, and links to ensure consistent
      Markdown syntax.

      5. Append metadata headers (e.g., CLI Tool vX.Y, build date, author, license)
      and a short release note.

      6. Verify that usage examples, option tables, and troubleshooting sections are
      complete and properly linked.


      Return the final documentation as plain‑text Markdown.'
  document_command_line_tool_part1:
    agent: false
    description: Generates the first, comprehensive section of the command‑line tool’s
      user documentation, detailing usage syntax, option tables, codec and numeric
      type support, real‑world examples, error handling, and practical troubleshooting
      notes.
    name: document_command_line_tool_part1
    nodes_depended_on:
    - design_command_line_interface_combined
    nodes_dependent_on: []
    output_structure:
    - description: Full markdown documentation string produced by the node.
      key: documentation_text
      type: str
    prompt: 'Part 1: Create an exhaustive, professional‑grade documentation section
      for the command‑line tool.


      *Structure:*  Use clear Markdown‑style headings (e.g., `## Overview`, `### Usage`,
      `#### Options`), tables for options/arguments, and bullet lists for notes.  Include
      at least three realistic example invocations that cover typical use‑cases.


      *Contents to cover:* 1. **Tool purpose & scope** – a concise description of
      the tool’s functionality and target user base.

      2. **Overall syntax** – the canonical command line pattern, including positional
      arguments and optional flags.

      3. **Detailed option list** – a table with columns: *Option*, *Short form*,
      *Default*, *Type*, *Description*, *Allowed values*.  Mention supported codecs
      (e.g., `mp3`, `aac`, `flac`) and numeric types (integers, floats, ranges) where
      relevant.

      4. **Examples** – at least three annotated command lines illustrating common
      workflows (e.g., converting a file, processing a batch, applying a filter).

      5. **Error handling** – common error messages and actionable troubleshooting
      steps, including exit codes and hints for diagnosing failures.

      6. **Notes** – special considerations (e.g., case sensitivity, platform differences,
      dependency requirements).


      *Output format:*  Return the documentation as plain text with proper line breaks
      and indentation.  The output must be a single string that can be directly inserted
      into a README or manual page.


      *No other data should be returned.*'
  document_command_line_tool_part2:
    agent: false
    description: Generates the second portion of the CLI tool documentation, including
      explicit usage examples, a meticulous breakdown of options, supported codecs
      and numeric types, and robust troubleshooting insights, designed to meet professional
      developer and end‑user needs.
    name: document_command_line_tool_part2
    nodes_depended_on:
    - design_command_line_interface_combined
    nodes_dependent_on: []
    output_structure:
    - description: Plain‑text Markdown documentation containing usage examples, option
        details, supported codec and numeric type lists, and troubleshooting information.
      key: documentation_text
      type: str
    prompt: 'Part 2: Write comprehensive and technically precise documentation for
      the CLI tool. Ensure the content includes detailed usage examples with realistic
      command-line invocations, an exhaustive explanation of each available option
      (covering flags, parameters, and their permissible values), and an in-depth
      summary of supported codecs, numeric types, and data formats. Additionally,
      provide explicit troubleshooting guidance for common errors, addressing their
      possible causes and step‑by‑step resolutions. Incorporate cross‑references to
      related commands or configurations, if applicable, and structure the documentation
      for clarity and professional technical formatting. Return the final documentation
      text as plain text, adhering to best practices in CLI documentation.'
  finalize_binary_data_parser_combined:
    agent: false
    description: Combines the two intermediate JSON package listings produced by the
      Part 1 and Part 2 nodes into a single, deduplicated manifest, validates file
      integrity via SHA‑256 checksums, and packages all assets into a distributable
      ZIP archive. The resulting package includes a complete README, test harness,
