      \nimport argparse\nimport json\nimport logging\nimport sys\nfrom pathlib import\
      \ Path\nfrom typing import List, Union\n\n# Assume these functions are provided\
      \ by previous nodes\nfrom codec_parsing import parse_with_codec\nfrom numeric_parsing\
      \ import parse_numeric_data\n\n# Build argument parser based on the JSON spec\
      \ from design_command_line_interface_combined\n\ndef build_parser() -> argparse.ArgumentParser:\n\
      \    parser = argparse.ArgumentParser(\n        prog=\"parse_cli\",\n      \
      \  description=\"Decode a binary file using a specified codec and numeric type.\"\
      ,\n    )\n    parser.add_argument(\"--input\", required=True, type=Path, help=\"\
      Path to the binary file.\")\n    parser.add_argument(\"--codec\", required=True,\
      \ choices=[\"utf-8\", \"utf-16le\", \"base64\"], help=\"Codec to apply to the\
      \ raw bytes.\")\n    parser.add_argument(\"--numeric\", required=True, choices=[\"\
      int\", \"float\", \"double\"], help=\"Numeric interpretation of the decoded\
      \ payload.\")\n    parser.add_argument(\"--output-format\", default=\"text\"\
      , choices=[\"text\", \"json\"], help=\"Format of the parsed output.\")\n   \
      \ parser.add_argument(\"--verbose\", action=\"store_true\", help=\"Enable verbose\
      \ logging.\")\n    return parser\n\n\n# Core orchestration function – unit‑testable\n\
      \ndef process_file(input_path: Path, codec: str, numeric: str, output_format:\
      \ str) -> Union[str, List[Union[int, float]]]:\n    logging.debug(\"Reading\
      \ file %s\", input_path)\n    raw_bytes = input_path.read_bytes()\n    logging.debug(\"\
      Read %d bytes\", len(raw_bytes))\n\n    logging.debug(\"Applying codec: %s\"\
