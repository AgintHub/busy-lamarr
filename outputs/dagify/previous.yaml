dag_type: plain_text
description: Creates a detailed, state‑level Monte Carlo simulation of human society
  by gathering data, defining models, running many independent simulation instances,
  and synthesizing the results.
name: monte_carlo_society_simulation
nodes:
  aggregate_simulation_results:
    agent: false
    description: Combine output from all runs into a unified dataset.
    name: aggregate_simulation_results
    nodes_depended_on:
    - run_simulation_batch
    nodes_dependent_on: []
    prompt: 'Read all run_*.json files, align them by state and time step, and compute
      the mean and standard deviation for each tracked metric. Produce a CSV with
      columns: State, Day, Metric, Mean, StdDev.'
  collect_state_demographics:
    agent: false
    description: Gather basic demographic attributes for each state.
    name: collect_state_demographics
    nodes_depended_on:
    - define_state_list
    nodes_dependent_on: []
    prompt: 'For each state listed, retrieve the latest population, median age, urban‑rural
      split (percentage urban), and education attainment (percentage with bachelor''s
      degree or higher). Return a CSV with columns: State, Population, MedianAge,
      PercentUrban, PercentBachelors.'
  collect_state_economic_data:
    agent: false
    description: Obtain economic indicators for each state.
    name: collect_state_economic_data
    nodes_depended_on:
    - define_state_list
    nodes_dependent_on: []
    prompt: 'For each state, collect GDP, unemployment rate, median household income,
      and major industry sectors (top three). Output a CSV with columns: State, GDP,
      UnemploymentRate, MedianIncome, TopIndustry1, TopIndustry2, TopIndustry3.'
  collect_state_environmental_params:
    agent: false
    description: Collect environmental indicators for each state.
    name: collect_state_environmental_params
    nodes_depended_on:
    - define_state_list
    nodes_dependent_on: []
    prompt: 'For each state, provide average annual temperature, air quality index
      (AQI), renewable energy share of total electricity, and total forest cover percentage.
      Return a CSV with columns: State, AvgTempC, AvgAQI, RenewableEnergyPct, ForestCoverPct.'
  collect_state_health_metrics:
    agent: false
    description: Retrieve public‑health statistics for each state.
    name: collect_state_health_metrics
    nodes_depended_on:
    - define_state_list
    nodes_dependent_on: []
    prompt: 'For each state, gather life expectancy, obesity prevalence, COVID‑19
      vaccination rate, and hospital beds per 1,000 residents. Output a CSV with columns:
      State, LifeExpectancy, ObesityPct, VaccinationPct, HospitalBedsPerK.'
  collect_state_political_structure:
    agent: false
    description: Acquire political governance data for each state.
    name: collect_state_political_structure
    nodes_depended_on:
    - define_state_list
    nodes_dependent_on: []
    prompt: 'For each state, list the party affiliation of the governor, the composition
      of the state legislature (percent Democratic, Republican), and the latest voter
      turnout percentage. Provide a CSV with columns: State, GovernorParty, LegislatureDemocratPct,
      LegislatureRepublicanPct, VoterTurnoutPct.'
  compile_final_report:
    agent: false
    description: Assemble a comprehensive report containing analysis, visualizations,
      and methodological details.
    name: compile_final_report
    nodes_depended_on:
    - perform_statistical_analysis
    - generate_visualizations
    nodes_dependent_on: []
    prompt: Write a concise report (max 2000 words) that includes an executive summary,
      methodology overview, key findings, interpretation of visualizations, and recommendations
      for policymakers. Embed references to the PNG files generated earlier.
  define_agent_model:
    agent: false
    description: Design the individual‑level agent representation used in the simulation.
    name: define_agent_model
    nodes_depended_on:
    - define_simulation_objectives
    - collect_state_demographics
    nodes_dependent_on: []
    prompt: 'Create a concise specification for an agent object that includes attributes:
      age, education level, employment status, income, health status, political preference,
      and location (state). Explain how each attribute will be initialized from the
      demographic data.'
  define_economic_model:
    agent: false
    description: Formulate the macro‑economic dynamics linking agents to state‑level
      indicators.
    name: define_economic_model
    nodes_depended_on:
    - collect_state_economic_data
    - define_interaction_model
    nodes_dependent_on: []
    prompt: Provide a brief mathematical formulation (e.g., production function, labor
      market equation) that maps aggregate agent income and employment to state GDP,
      unemployment rate, and median income. Use symbols only; no prose.
  define_environmental_model:
    agent: false
    description: Describe how environmental factors affect agents and state metrics.
    name: define_environmental_model
    nodes_depended_on:
    - collect_state_environmental_params
    - define_interaction_model
    nodes_dependent_on: []
    prompt: Provide a short rule set that links average temperature and AQI to health
      outcomes, and renewable energy share to economic productivity. Present each
      rule as “If … then …”.
  define_health_model:
    agent: false
    description: Model health outcomes and disease spread at the agent level.
    name: define_health_model
    nodes_depended_on:
    - collect_state_health_metrics
    - define_interaction_model
    nodes_dependent_on: []
    prompt: Write a concise compartmental (S‑I‑R) style update for each agent, where
      transmission probability depends on population density and vaccination rate.
      Include a formula for mortality risk based on age and obesity.
  define_interaction_model:
    agent: false
    description: Specify how agents interact with each other and with their environment.
    name: define_interaction_model
    nodes_depended_on:
    - define_agent_model
    nodes_dependent_on: []
    prompt: Describe a set of interaction rules (e.g., economic transactions, information
      exchange, disease transmission) that operate on a daily time step. Keep each
      rule to one sentence and indicate which agent attributes are affected.
  define_political_model:
    agent: false
    description: Create the political decision‑making process for agents and states.
    name: define_political_model
    nodes_depended_on:
    - collect_state_political_structure
    - define_interaction_model
    nodes_dependent_on: []
    prompt: Outline a simple voting model where agents cast votes based on political
      preference, influencing state legislative composition and governor party. Express
      the update rule in one equation.
  define_simulation_objectives:
    agent: false
    description: Specify the high‑level goals and measurable outcomes the simulation
      must produce.
    name: define_simulation_objectives
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: List the primary objectives of the Monte Carlo simulation (e.g., forecast
      economic output, political stability, health outcomes) and the key metrics that
      will be tracked for each U.S. state.
  define_state_list:
    agent: false
    description: Create a master list of all U.S. states that will be modeled.
    name: define_state_list
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Provide a plain‑text list of the 50 U.S. states using their standard two‑letter
      abbreviations, one per line.
  generate_random_seed:
    agent: false
    description: Produce a high‑entropy seed for stochastic processes.
    name: generate_random_seed
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Generate a 64‑bit integer using a cryptographically secure random source
      and return it as plain text.
  generate_visualizations:
    agent: false
    description: Create charts and maps that illustrate key simulation outcomes.
    name: generate_visualizations
    nodes_depended_on:
    - perform_statistical_analysis
    nodes_dependent_on: []
    prompt: 'Produce the following visual assets: (1) line plot of average GDP over
      time for the top 5 states, (2) heat map of average health index by state, (3)
      bar chart of political composition variance. Save each as a PNG file with descriptive
      filenames.'
  perform_statistical_analysis:
    agent: false
    description: Analyze aggregated results to answer the original objectives.
    name: perform_statistical_analysis
    nodes_depended_on:
    - aggregate_simulation_results
    nodes_dependent_on: []
    prompt: For each objective metric, calculate confidence intervals (95%) across
      the Monte Carlo runs and identify statistically significant differences between
      states. Summarize findings in a bullet‑point list.
  run_one_simulation_instance:
    agent: false
    description: Execute a single Monte Carlo simulation run using all defined models
      and the random seed.
    name: run_one_simulation_instance
    nodes_depended_on:
    - define_agent_model
    - define_interaction_model
    - define_economic_model
    - define_political_model
    - define_health_model
    - define_environmental_model
    - generate_random_seed
    nodes_dependent_on: []
    prompt: Using the provided models and seed, simulate 10 years of daily steps for
      all agents across the 50 states. Record the time‑series of each state’s GDP,
      unemployment, health index, and political composition. Output a compressed JSON
      file containing the full time‑series for every state.
  run_simulation_batch:
    agent: false
    description: Launch many independent simulation instances in parallel.
    name: run_simulation_batch
    nodes_depended_on:
    - run_one_simulation_instance
    nodes_dependent_on: []
    prompt: Create 1,000 independent runs of the simulation by repeatedly invoking
      the "run_one_simulation_instance" step with a new random seed each time. Store
      each run’s JSON output in a numbered file (run_001.json … run_1000.json).
