dag_type: plain_text
description: A workflow that builds a binary data parser. Each original step is split
  into two concurrent sub‑steps that feed the next steps, with all outputs combined
  before proceeding.
name: binary_data_parser_workflow
nodes:
  define_supported_codecs_part1:
    agent: false
    description: Generate the list of codec identifiers the parser supports.
    name: define_supported_codecs_part1
    nodes_depended_on: []
    nodes_dependent_on:
    - implement_codec_parsing_logic_part1
    - design_command_line_interface_part1
    prompt: Provide a comma‑separated list of codec identifiers that the binary parser
      should handle, including common text encodings such as ASCII, ISO‑8859‑1, UTF‑8,
      UTF‑16 (little endian, big endian), and binary representations such as Base64.
      For each codec, specify its name and a short description of its characteristics.
      Return the list as a JSON array of objects with fields "codec" and "description".
  define_supported_codecs_part2:
    agent: false
    description: Generate the list of codec identifiers the parser supports.
    name: define_supported_codecs_part2
    nodes_depended_on: []
    nodes_dependent_on:
    - implement_codec_parsing_logic_part2
    - design_command_line_interface_part2
    prompt: Provide a comma‑separated list of codec identifiers that the binary parser
      should handle, including common text encodings such as ASCII, ISO‑8859‑1, UTF‑8,
      UTF‑16 (little endian, big endian), and binary representations such as Base64.
      For each codec, specify its name and a short description of its characteristics.
      Return the list as a JSON array of objects with fields "codec" and "description".
  define_supported_numeric_types_part1:
    agent: false
    description: Generate the list of numeric types the parser must support.
    name: define_supported_numeric_types_part1
    nodes_depended_on: []
    nodes_dependent_on:
    - implement_numeric_parsing_logic_part1
    - design_command_line_interface_part1
    prompt: List the numeric data types that the parser must support, covering signed
      and unsigned integers of 8, 16, 32, and 64 bits, as well as single and double
      precision floating point. For each type, include its name (e.g., int8, uint16,
      float32) and specify byte order (little endian, big endian) if applicable. Output
      as a JSON array with fields "type" and "description".
  define_supported_numeric_types_part2:
    agent: false
    description: Generate the list of numeric types the parser must support.
    name: define_supported_numeric_types_part2
    nodes_depended_on: []
    nodes_dependent_on:
    - implement_numeric_parsing_logic_part2
    - design_command_line_interface_part2
    prompt: List the numeric data types that the parser must support, covering signed
      and unsigned integers of 8, 16, 32, and 64 bits, as well as single and double
      precision floating point. For each type, include its name (e.g., int8, uint16,
      float32) and specify byte order (little endian, big endian) if applicable. Output
      as a JSON array with fields "type" and "description".
  design_command_line_interface_part1:
    agent: false
    description: Define the command‑line interface for the parser.
    name: design_command_line_interface_part1
    nodes_depended_on:
    - define_supported_codecs_part1
    - define_supported_numeric_types_part1
    nodes_dependent_on:
    - document_command_line_tool_part1
    - integrate_parsing_logic_part1
    prompt: Design a command‑line interface for the binary parser. Include a help
      flag, an input file argument, optional codec selection (--codec), optional numeric
      type selection (--type), and flags for verbosity and output format. Provide
      a concise description of each argument and its expected values, along with short
      and long forms, default values, and help text. Output the interface specification
      in JSON format with fields for "name", "description", "arguments" array of objects
      with "flag", "short", "long", "default", "help", "required", and "type".
  design_command_line_interface_part2:
    agent: false
    description: Define the command‑line interface for the parser.
    name: design_command_line_interface_part2
    nodes_depended_on:
    - define_supported_codecs_part2
    - define_supported_numeric_types_part2
    nodes_dependent_on:
    - document_command_line_tool_part2
    - integrate_parsing_logic_part2
    prompt: Design a command‑line interface for the binary parser. Include a help
      flag, an input file argument, optional codec selection (--codec), optional numeric
      type selection (--type), and flags for verbosity and output format. Provide
      a concise description of each argument and its expected values, along with short
      and long forms, default values, and help text. Output the interface specification
      in JSON format with fields for "name", "description", "arguments" array of objects
      with "flag", "short", "long", "default", "help", "required", and "type".
  document_command_line_tool_part1:
    agent: false
    description: Create documentation for the command‑line tool.
    name: document_command_line_tool_part1
    nodes_depended_on:
    - design_command_line_interface_part1
    nodes_dependent_on:
    - finalize_binary_data_parser_part1
    prompt: Write thorough documentation for the CLI tool. Include usage examples
      with real command lines, a description of each option, and notes on supported
      codecs and numeric types. Also provide troubleshooting guidance for common errors.
      Return the documentation as plain text.
  document_command_line_tool_part2:
    agent: false
    description: Create documentation for the command‑line tool.
    name: document_command_line_tool_part2
    nodes_depended_on:
    - design_command_line_interface_part2
    nodes_dependent_on:
    - finalize_binary_data_parser_part2
    prompt: Write thorough documentation for the CLI tool. Include usage examples
      with real command lines, a description of each option, and notes on supported
      codecs and numeric types. Also provide troubleshooting guidance for common errors.
      Return the documentation as plain text.
  finalize_binary_data_parser_part1:
    agent: false
    description: Package the parser and its artifacts.
    name: finalize_binary_data_parser_part1
    nodes_depended_on:
    - integrate_parsing_logic_part1
    - write_test_cases_part1
    - document_command_line_tool_part1
    nodes_dependent_on: []
    prompt: Merge the integrated parser script, test cases, and documentation into
      a final package. Provide a README with installation instructions, usage guide,
      and test execution steps. Output the complete archive contents as a JSON with
      file paths and contents. Ensure all dependencies are listed and that the package
      can be built and tested by running `python -m unittest`.
  finalize_binary_data_parser_part2:
    agent: false
    description: Package the parser and its artifacts.
    name: finalize_binary_data_parser_part2
    nodes_depended_on:
    - integrate_parsing_logic_part2
    - write_test_cases_part2
    - document_command_line_tool_part2
    nodes_dependent_on: []
    prompt: Merge the integrated parser script, test cases, and documentation into
      a final package. Provide a README with installation instructions, usage guide,
      and test execution steps. Output the complete archive contents as a JSON with
      file paths and contents. Ensure all dependencies are listed and that the package
      can be built and tested by running `python -m unittest`.
  implement_codec_parsing_logic_part1:
    agent: false
    description: Implement codec parsing functions.
    name: implement_codec_parsing_logic_part1
    nodes_depended_on:
    - define_supported_codecs_part1
    nodes_dependent_on:
    - integrate_parsing_logic_part1
    prompt: Implement the code that decodes binary input into the specified codecs.
      For each codec from the definition step, provide a function that takes a byte
      array and returns the decoded string or appropriate data structure, handling
      errors and reporting decoding failures. Return the complete implementation as
      Python code snippets, including necessary imports.
  implement_codec_parsing_logic_part2:
    agent: false
    description: Implement codec parsing functions.
    name: implement_codec_parsing_logic_part2
    nodes_depended_on:
    - define_supported_codecs_part2
    nodes_dependent_on:
    - integrate_parsing_logic_part2
    prompt: Implement the code that decodes binary input into the specified codecs.
      For each codec from the definition step, provide a function that takes a byte
      array and returns the decoded string or appropriate data structure, handling
      errors and reporting decoding failures. Return the complete implementation as
      Python code snippets, including necessary imports.
  implement_numeric_parsing_logic_part1:
    agent: false
    description: Implement numeric parsing functions.
    name: implement_numeric_parsing_logic_part1
    nodes_depended_on:
    - define_supported_numeric_types_part1
    nodes_dependent_on:
    - integrate_parsing_logic_part1
    prompt: Implement code to parse numeric values from binary data for each numeric
      type defined earlier. Provide functions that read a sequence of bytes and return
      the numeric value, handling endianness. Output the implementation as Python
      code snippets with imports.
  implement_numeric_parsing_logic_part2:
    agent: false
    description: Implement numeric parsing functions.
    name: implement_numeric_parsing_logic_part2
    nodes_depended_on:
    - define_supported_numeric_types_part2
    nodes_dependent_on:
    - integrate_parsing_logic_part2
    prompt: Implement code to parse numeric values from binary data for each numeric
      type defined earlier. Provide functions that read a sequence of bytes and return
      the numeric value, handling endianness. Output the implementation as Python
      code snippets with imports.
  integrate_parsing_logic_part1:
    agent: false
    description: Combine parsing functions into a CLI program.
    name: integrate_parsing_logic_part1
    nodes_depended_on:
    - implement_codec_parsing_logic_part1
    - implement_numeric_parsing_logic_part1
    - design_command_line_interface_part1
    nodes_dependent_on:
    - write_test_cases_part1
    prompt: Combine the codec and numeric parsing functions into a single CLI program
      that accepts an input file, codec, and numeric type arguments. Show how the
      selected codec and numeric type are applied to read and interpret the binary
      file, and how results are displayed to the user. Provide a full Python script
      with argument parsing, calling parsing functions, and formatting output. Include
      comments.
  integrate_parsing_logic_part2:
    agent: false
    description: Combine parsing functions into a CLI program.
    name: integrate_parsing_logic_part2
    nodes_depended_on:
    - implement_codec_parsing_logic_part2
    - implement_numeric_parsing_logic_part2
    - design_command_line_interface_part2
    nodes_dependent_on:
    - write_test_cases_part2
    prompt: Combine the codec and numeric parsing functions into a single CLI program
      that accepts an input file, codec, and numeric type arguments. Show how the
      selected codec and numeric type are applied to read and interpret the binary
      file, and how results are displayed to the user. Provide a full Python script
      with argument parsing, calling parsing functions, and formatting output. Include
      comments.
  write_test_cases_part1:
    agent: false
    description: Create test cases for parsing logic.
    name: write_test_cases_part1
    nodes_depended_on:
    - integrate_parsing_logic_part1
    nodes_dependent_on:
    - finalize_binary_data_parser_part1
    prompt: Write comprehensive test cases covering all codecs and numeric types.
      For each case, specify test name, input bytes (hex), expected decoded output,
      and expected error handling. Provide these in a JSON array with 'test_name',
      'input_bytes', 'expected_output', and 'expected_error'.
  write_test_cases_part2:
    agent: false
    description: Create test cases for parsing logic.
    name: write_test_cases_part2
    nodes_depended_on:
    - integrate_parsing_logic_part2
    nodes_dependent_on:
    - finalize_binary_data_parser_part2
    prompt: Write comprehensive test cases covering all codecs and numeric types.
      For each case, specify test name, input bytes (hex), expected decoded output,
      and expected error handling. Provide these in a JSON array with 'test_name',
      'input_bytes', 'expected_output', and 'expected_error'.
