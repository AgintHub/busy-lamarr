dag_type: plain_text
description: Workflow to design and build components of a binary data parser with
  detailed technical prompts for each step.
name: build_binary_data_parser_with_parallel_parts
nodes:
  define_supported_codecs_combined:
    agent: false
    description: Merge the two partial codec lists into a single final list with complete
      detailed descriptions.
    name: define_supported_codecs_combined
    nodes_depended_on:
    - define_supported_codecs_part1
    - define_supported_codecs_part2
    nodes_dependent_on:
    - design_command_line_interface_part1
    - design_command_line_interface_part2
    - implement_codec_parsing_logic_part1
    - implement_codec_parsing_logic_part2
    prompt: Combine the outputs from Part 1 and Part 2 to produce the final list of
      supported codecs. Merge the two JSON arrays, ensuring all entries have detailed
      descriptions and properly resolving any duplicate codec identifiers or overlapping
      entries.
  define_supported_codecs_part1:
    agent: false
    description: Generate first part of the supported codecs list with detailed descriptions.
    name: define_supported_codecs_part1
    nodes_depended_on: []
    nodes_dependent_on:
    - define_supported_codecs_combined
    prompt: 'Part 1: Provide a comma‑separated list of codec identifiers that the
      binary parser should handle. These include common text encodings such as ASCII,
      ISO‑8859‑1, UTF‑8, UTF‑16 (little endian, big endian), and binary representations
      such as Base64. For each codec, provide a technical description including its
      name, purpose, and primary use cases. Specify any associated encoding characteristics
      or limitations (e.g., byte order or special character handling). Return the
      list as a JSON array of objects with fields "codec", "description", and if applicable,
      "limitations".'
  define_supported_codecs_part2:
    agent: false
    description: Generate the second part of the supported codecs list with detailed
      technical details.
    name: define_supported_codecs_part2
    nodes_depended_on: []
    nodes_dependent_on:
    - define_supported_codecs_combined
    prompt: 'Part 2: Provide a comma‑separated list of codec identifiers that the
      binary parser should handle. These include additional text encodings and binary
      representations commonly used. For each codec, provide a technical description
      including its name, purpose, primary use cases, and encoding characteristics.
      If applicable, identify any specific limitations or edge cases. Return the list
      as a JSON array of objects with fields "codec", "description", and "limitations".'
  define_supported_numeric_types_combined:
    agent: false
    description: Merge the two partial numeric types lists into a complete final list
      with detailed technical descriptions.
    name: define_supported_numeric_types_combined
    nodes_depended_on:
    - define_supported_numeric_types_part1
    - define_supported_numeric_types_part2
    nodes_dependent_on:
    - design_command_line_interface_part1
    - design_command_line_interface_part2
    - implement_numeric_parsing_logic_part1
    - implement_numeric_parsing_logic_part2
    prompt: Combine the outputs from Part 1 and Part 2 to produce a complete numeric
      types list. Merge numeric type entries, ensuring all descriptions and storage
      details are consistent and resolving any duplication.
  define_supported_numeric_types_part1:
    agent: false
    description: Generate first part of the numeric types list with detailed specifications.
    name: define_supported_numeric_types_part1
    nodes_depended_on: []
    nodes_dependent_on:
    - define_supported_numeric_types_combined
    prompt: 'Part 1: List the numeric data types that the parser must support, such
      as signed and unsigned integers of 8, 16, 32, and 64 bits, along with single
      and double-precision floating point types. Provide detailed specifications including
      type name (e.g., int8, uint16, float32), byte order (little endian or big endian
      if applicable), and storage size in bytes. Note if there are any specific constraints
      or representations (e.g., special values like NaN for floats). Output as a JSON
      array with fields "type", "description", and "storage_description".'
  define_supported_numeric_types_part2:
    agent: false
    description: Generate second part of the numeric types list with detailed technical
      details.
    name: define_supported_numeric_types_part2
    nodes_depended_on: []
    nodes_dependent_on:
    - define_supported_numeric_types_combined
    prompt: 'Part 2: Expand the list of numeric types to cover additional precision
      levels or representations (if any). Include a description for each covering
      its name, bit storage size, byte order (if applicable), and its typical usage
      context. Include examples of its values or representation (e.g., the range of
      integers or encoding for special values for floats). Return structured output
      as a JSON array with fields "type", "description", "storage_description".'
  design_command_line_interface_combined:
    agent: false
    description: Merge the two partial CLI interface designs into a complete specification
      with detailed mappings to earlier components.
    name: design_command_line_interface_combined
    nodes_depended_on:
    - design_command_line_interface_part1
    - design_command_line_interface_part2
    nodes_dependent_on:
    - document_command_line_tool_part1
    - document_command_line_tool_part2
    - integrate_parsing_logic_part1
    - integrate_parsing_logic_part2
    prompt: Combine the output specifications from Part 1 and Part 2 into a complete
      CLI design. Merge argument lists, resolve overlaps, and include detailed mappings
      for dependencies with flags. Ensure examples and descriptions are included for
      final usage.
  design_command_line_interface_part1:
    agent: false
    description: Generate the first part of a CLI design with detailed technical argument
      descriptions.
    name: design_command_line_interface_part1
    nodes_depended_on:
    - define_supported_codecs_combined
    - define_supported_numeric_types_combined
    nodes_dependent_on:
    - design_command_line_interface_combined
    prompt: 'Part 1: Design a command‑line interface for the binary parser. Include
      options such as a help flag, input file argument, codec selection (--codec),
      numeric type selection (--type), verbosity, and output format. Provide a JSON
      specification for the CLI with fields like "arguments" (including technical
      descriptions for flags, their purpose, and constraints). Ensure accurate mapping
      of selections (e.g., codec and numeric type) to the parser.'
  design_command_line_interface_part2:
    agent: false
    description: Generate the second part of CLI design with additional use cases
      and technical argument details.
    name: design_command_line_interface_part2
    nodes_depended_on:
    - define_supported_codecs_combined
    - define_supported_numeric_types_combined
    nodes_dependent_on:
    - design_command_line_interface_combined
    prompt: 'Part 2: Expand on the CLI design by refining usage details and including
      examples for flags. Capture additional arguments or constraints based on prior
      codec and numeric type dependencies. Return the expanded JSON specification,
      ensuring alignment with parsing capabilities identified in earlier steps.'
